<style>
/* Layout: a fixed stage ladder on the left (top bar on phones) and one reading column of

:root {

  --surface: #ffffff;
  --surface-2: #eceff3;
  --line: #d5dbe2;
  --line-strong: #aeb8c4;

  --ink-2: #3b4754;
  --muted: #66727f;
  --accent: #0d6b5e;
  --accent-ink: #ffffff;
  --accent-soft: #e1f0ed;
  --good: #1d7a4a;
  --good-soft: #e3f3ea;
  --warn: #9a6212;
  --warn-soft: #fbf0dc;
  --bad: #b42318;
  --bad-soft: #fbe7e5;
  --info: #285e8e;
  --info-soft: #e5eef7;
  --focus: #0d6b5e;

  --chart-surface: #ffffff;
  --chart-grid: #e6eaef;
  --chart-axis: #aeb8c4;
  --chart-pos: #2b67a6;
  --chart-neg: #c0392b;
  --series-1: #0d6b5e;
  --series-2: #b7791f;
  --series-3: #6b5b95;
  --series-4: #4a6378;
  --series-5: #6e7f3a;
  --series-6: #9c5a4a;
  --series-7: #2f8f9d;
  --series-8: #8a8f98;
  --seq-0: #eef3f6;
  --seq-1: #c9dce4;
  --seq-2: #93bccb;

  --font-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --nav-w: 272px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318;
    --surface: #151c23;
    --surface-2: #1b242d;
    --line: #2a3540;
    --line-strong: #43515f;
    --ink: #e7ecf1;

    --muted: #8d99a6;
    --accent: #4fc0a9;
    --accent-ink: #062520;

    --warn: #e2a64b;

    --bad-soft: #321a18;

    --chart-surface: #151c23;

:root[data-theme="dark"] {
  --bg: #0e1318;
  --surface: #151c23;
  --surface-2: #1b242d;
  --line: #2a3540;
  --line-strong: #43515f;

  --muted: #8d99a6;
  --accent: #4fc0a9;
  --accent-ink: #062520;
  --accent-soft: #15302b;
  --good: #5cc98c;
  --good-soft: #15291e;
  --warn: #e2a64b;
  --warn-soft: #2d2412;
  --bad: #f07a6e;
  --bad-soft: #321a18;
  --info: #79aee0;
  --info-soft: #172634;

  --chart-surface: #151c23;
  --chart-grid: #232d37;
  --chart-axis: #43515f;
  --chart-pos: #6ea6e0;

}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
#root { min-height: 100%; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.15rem); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
p { margin: 0; max-width: 72ch; }
a { color: var(--accent); }
b, strong { font-weight: 650; }
ul, ol { margin: 0; padding-left: 1.2em; }
.icon { flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.mono { font-family: var(--font-data); font-size: 0.86rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.de { color: var(--muted); font-weight: 400; font-style: italic; }
.ok-text { color: var(--good); font-weight: 600; }
.plain { list-style: none; padding: 0; display: grid; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ------------------------------------------------------------------ shell */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100%; }
.nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 20px 16px 24px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark, .boot-mark {
  width: 38px; height: 38px; border-radius: var(--r-sm); flex: none;
  display: grid; place-items: center;
  background: var(--ink); color: var(--surface);
  font: 600 0.95rem/1 var(--font-display); letter-spacing: 0.04em;
}
.brand-name { font: 600 1.1rem/1.2 var(--font-display); }
.brand-sub { font-size: 0.78rem; color: var(--muted); }
.nav-toggle {
  display: none; margin-left: auto; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer;
}
.nav-body { display: flex; flex-direction: column; gap: 14px; }
.nav-caption { font-size: 0.8rem; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }
.stage-nav, .nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group { border-top: 1px solid var(--line); padding-top: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 8px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--ink-2); text-align: left;
  font: inherit; font-size: 0.92rem; cursor: pointer;
}
.nav-item:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-item:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.7; }
.nav-num {
  width: 24px; height: 24px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong); color: var(--ink-2);
  font: 500 0.78rem/1 var(--font-data);
}
.nav-item.active .nav-num { border-color: var(--accent); color: var(--accent); }
.nav-item.passed .nav-num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.save-badge { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--muted); line-height: 1.35; }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-top: 5px; flex: none; }
.save-badge.account .save-dot { background: var(--good); }
.save-badge.local .save-dot { background: var(--warn); }
.save-badge.none .save-dot { background: var(--bad); }

.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 48px; }
.page { max-width: 1120px; display: flex; flex-direction: column; gap: 28px; }
.foot { max-width: 1120px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }

.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; max-height: 100vh;
    border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 12px;
  }
  .nav-toggle { display: inline-flex; }
  .nav .nav-body { display: none; }
  .nav.open .nav-body { display: flex; padding-bottom: 8px; }
  .brand-sub { display: none; }
  .main { padding: 20px 16px 40px; }
}

/* ------------------------------------------------------------------ headers */
.stage-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.kicker, .eyebrow {
  font: 500 0.74rem/1.3 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.eyebrow.accent { color: var(--accent); }
.head-co { color: var(--muted); font-weight: 400; }
.head-goal { color: var(--ink-2); font-size: 1.02rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip {
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 0.8rem; color: var(--ink-2);
}

/* ------------------------------------------------------------------ layout helpers */
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack.tight { gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 16px 20px; align-items: start; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-2.wide-left { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.grid-2.wide-right { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
.grid-2 > *, .grid-3 > *, .grid-4 > * { min-width: 0; }
@media (max-width: 860px) {
  .grid-2, .grid-2.wide-left, .grid-2.wide-right { grid-template-columns: minmax(0, 1fr); }
}

.section { display: flex; flex-direction: column; gap: 14px; padding-top: 22px; border-top: 1px solid var(--line); min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; min-width: 0; }
.card.facts { display: grid; gap: 6px; }

.split { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.split-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.side-list {
  position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px;
  max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px;
}
.side-list .eyebrow { margin-bottom: 2px; }
.side-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--ink-2); font: inherit; font-size: 0.9rem; text-align: left; cursor: pointer;
}
.side-item:hover { background: var(--surface-2); }
.side-item.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .side-list { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .side-list .eyebrow, .side-list > p { flex-basis: 100%; }
  .side-item { border: 1px solid var(--line); background: var(--surface); }
}

.status-dot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; flex: none; color: var(--muted); }
.status-dot.done { color: var(--good); }
.status-dot.half { color: var(--warn); }
.status-dot:empty { width: 10px; height: 10px; border: 1.5px solid var(--line-strong); }
.status-dot.done:empty { background: var(--good); border-color: var(--good); }
.status-dot.half:empty { background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); border-color: var(--warn); }

/* ------------------------------------------------------------------ guidance boxes */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.task-body { color: var(--ink-2); max-width: 72ch; }
.cfa { border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--ink-2); }
.callout { border: 1px solid; border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 0.93rem; }
.callout > div { max-width: 80ch; }
.callout-title { font-weight: 650; }
.callout-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 35%, transparent); }
.callout-success { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.callout-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.callout-error { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.callout-info .callout-title { color: var(--info); }
.callout-success .callout-title { color: var(--good); }
.callout-warn .callout-title { color: var(--warn); }
.callout-error .callout-title { color: var(--bad); }

.checklist { list-style: none; padding: 0; display: grid; gap: 6px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); }
.checklist .mark { margin-top: 3px; color: var(--muted); display: inline-flex; }
.checklist li.ok .mark { color: var(--good); }

.details { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.details > summary {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; list-style: none; font-weight: 600;
}
.details > summary::-webkit-details-marker { display: none; }
.details > summary::after { content: "+"; margin-left: auto; font-family: var(--font-data); color: var(--muted); }
.details[open] > summary::after { content: "−"; }
.details-body { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  background: transparent; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab-panel { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; min-width: 0; }
.metric-label { font-size: 0.78rem; color: var(--muted); }
.metric-value { font: 500 1.35rem/1.3 var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }

.coverage { display: flex; flex-direction: column; gap: 8px; }
.tag { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.82rem; color: var(--ink-2); }
.tag-ok { background: var(--good-soft); border-color: transparent; color: var(--good); }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); max-width: 100%; }
.table-wrap.tall { max-height: 70vh; overflow-y: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.table th, .table td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table thead th {
  position: sticky; top: 0; z-index: 1; background: var(--surface-2);
  font: 500 0.74rem/1.3 var(--font-data); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap;
}
.table tbody tr:last-child > * { border-bottom: 0; }
.table td.num, .table th.num { text-align: right; font-family: var(--font-data); font-size: 0.84rem; white-space: nowrap; }
.group-row td { background: var(--surface-2); font: 500 0.72rem/1.3 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.metric-cell { min-width: 190px; font-weight: 500; }
.unit { color: var(--muted); white-space: nowrap; font-size: 0.8rem; }
.req { color: var(--accent); }
.data-grid td { padding: 3px 6px; vertical-align: middle; }
.cell {
  width: 100%; min-width: 92px; padding: 5px 7px; border: 1px solid transparent; border-radius: 4px;
  background: transparent; color: var(--ink); font: 0.84rem var(--font-data); text-align: right; font-variant-numeric: tabular-nums;
}
.cell.text { text-align: left; font-family: var(--font-body); min-width: 140px; }
.cell:hover { border-color: var(--line); }
.cell:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.sev { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
.sev-error { background: var(--bad-soft); color: var(--bad); }
.sev-warning { background: var(--warn-soft); color: var(--warn); }
.sev-info { background: var(--info-soft); color: var(--info); }
td.sev-cell { box-shadow: inset 3px 0 0 currentColor; }
.missing { color: var(--bad); font-style: italic; }

/* ------------------------------------------------------------------ forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .choice > legend { font-size: 0.88rem; font-weight: 600; color: var(--ink); }
.field-help, .field-hint { font-size: 0.8rem; color: var(--muted); }
.field input[type="text"], .field textarea, .field select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.94rem;
}
.field textarea { resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.field input:disabled { background: var(--surface-2); color: var(--muted); }
.num-wrap { display: flex; align-items: center; gap: 6px; }
.num-input { font-family: var(--font-data) !important; font-variant-numeric: tabular-nums; max-width: 220px; }
.field.compact .num-input { max-width: 140px; }
.suffix { color: var(--muted); font-size: 0.85rem; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }

.choice { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.choice > legend { padding: 0; margin-bottom: 8px; }
.choice-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.choice-opts.vertical { flex-direction: column; align-items: stretch; }
.pill {
  position: relative; display: inline-flex; align-items: center; padding: 6px 13px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
  color: var(--ink-2); font-size: 0.9rem; cursor: pointer; user-select: none;
}
.choice-opts.vertical .pill { border-radius: var(--r-sm); }
.pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill.dim { opacity: 0.5; cursor: not-allowed; }
.pill:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.choice:disabled .pill { opacity: 0.6; cursor: default; }

.slider { gap: 4px; }
.slider-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.slider-head label { font-size: 0.88rem; font-weight: 600; }
.slider output { font: 500 0.88rem var(--font-data); color: var(--accent); font-variant-numeric: tabular-nums; }
.slider input[type="range"] { width: 100%; accent-color: var(--accent); }

.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.92rem; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 36px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background 0.15s; }
.thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.toggle input:checked + .track { background: var(--accent); }
.toggle input:checked + .track .thumb { transform: translateX(16px); }
.toggle input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 15px; border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }

/* ------------------------------------------------------------------ formulas & text */
.formula { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-display); font-size: 1.05rem; }
.frac { display: inline-flex; flex-direction: column; align-items: center; text-align: center; }
.f-num { padding: 0 6px 3px; border-bottom: 1.5px solid var(--ink); }
.f-den { padding: 3px 6px 0; }
.f-lhs { font-weight: 600; }
.f-eq, .f-times { color: var(--ink-2); }
.formulas { display: grid; gap: 4px; font-family: var(--font-data); font-size: 0.84rem; color: var(--ink-2); }
.formula-line { font-family: var(--font-data); font-size: 0.86rem; color: var(--ink-2); }
.big-q { font-size: 1.25rem; margin-top: 8px; }
.md-preview { white-space: pre-wrap; overflow-wrap: anywhere; font: 0.84rem/1.55 var(--font-data); color: var(--ink-2); margin: 0; }

/* ------------------------------------------------------------------ charts */
.chart { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chart > div:first-child { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--chart-surface); }

/* ------------------------------------------------------------------ bridge (stage 6) */
.bridge-rows { display: flex; flex-direction: column; gap: 6px; }
.bridge-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bridge-row .grow { flex: 1 1 220px; border-color: var(--line); }
.bridge-row .cell { border-color: var(--line); max-width: 160px; }

/* ------------------------------------------------------------------ quiz */
.stage-foot { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.stage-foot > .section { align-self: stretch; }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.q.graded.right { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.q.graded.wrong { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.q-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { padding: 1px 9px; border-radius: 999px; background: var(--surface-2); font: 500 0.74rem/1.6 var(--font-data); color: var(--ink-2); }
.badge-ok { background: var(--good-soft); color: var(--good); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.q-prompt { font-size: 0.98rem; }
.score { font-size: 1rem; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.bad { color: var(--bad); }

</style>

); industrials: about 10\u201325 %"}},{key:"roa",en:"Return on assets (ROA)",de:"Gesamtkapitalrendite",text:"Net income \xF7 average total assets \xD7 100",unit:"%",sectors:["bank","insurer","corporate"],higher_is_better:!0,core:!0,cfa:"roa",inputs:[{metric:"net_income",averaged:!1,opening:!1},{metric:"total_assets",averaged:!0,opening:!1}],interpretation:{bank:"Banks earn thin returns on a large balance sheet: 0.3\u20131 % is normal. A low ROA with a decent ROE means high leverage. Wealth managers with off-balance-sheet client assets can earn higher ROA.",insurer:"Insurers' balance sheets include large policyholder assets (e.g. unit-linked funds) on which they earn only fees \u2014 ROA is low by design. Compare with peers on the same accounting basis.",corporate:"Non-financial companies earn far more per unit of assets than banks: 5\u201315 % is common. Large acquired intangibles and goodwill depress ROA; asset-light businesses show high ROA."},benchmark:{bank:"about 0.3\u20131.0 %",insurer:"about 0.3\u20131.5 %",corporate:"about 5\u201315 %"}},{key:"net_margin",en:"Net profit margin",de:"Nettogewinnmarge",text:"Net income \xF7 revenue (total operating income) \xD7 100",unit:"%",sectors:["bank","insurer","corporate"],higher_is_better:!0,core:!0,cfa:"net_margin",inputs:[{metric:"net_income",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{bank:"Share of operating income that ends up as profit for shareholders. Falls when costs, credit losses or taxes rise. A margin above 50 % usually signals a one-off gain.",insurer:"Depends heavily on what 'revenue' contains: IFRS 4 premiums (incl. savings) give low margins; IFRS 17 insurance revenue gives higher ones. Never compare across the accounting break.",corporate:"Share of sales left after all costs, interest and tax. Patented medicines earn high margins (15\u201330 %); industrials 5\u201312 %. Disposal gains and impairments distort it \u2014 compare with the EBIT margin and with the company's 'core' or 'adjusted' figures."},benchmark:{bank:"about 15\u201330 %",insurer:"basis-dependent (IFRS 17: about 5\u201315 %)",corporate:"pharma about 15\u201330 %; industrials about 5\u201312 %"}},{key:"cost_income",en:"Cost/income ratio",de:"Aufwand-Ertrags-Verh\xE4ltnis",text:"Operating expenses \xF7 total operating income \xD7 100",unit:"%",sectors:["bank"],higher_is_better:!1,core:!0,cfa:"cost_income",inputs:[{metric:"operating_expenses",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{bank:"How many francs/dollars of cost the bank spends to earn one of income. Lower is better. Private banks run 60\u201380 %; efficient retail banks 50\u201360 %. Rising C/I with falling income = negative operating leverage."},benchmark:{bank:"about 55\u201380 %"}},{key:"leverage",en:"Financial leverage (equity multiplier)",de:"Finanzielle Hebelwirkung (Eigenkapitalmultiplikator)",text:"Average total assets \xF7 average shareholders' equity (times)",unit:"x",sectors:["bank","insurer","corporate"],higher_is_better:null,core:["bank","insurer"],cfa:"leverage",inputs:[{metric:"total_assets",averaged:!0,opening:!1},{metric:"total_equity",averaged:!0,opening:!1}],interpretation:{bank:"Banks typically run 12\u201325\xD7 leverage. Higher leverage boosts ROE but leaves less loss absorption \u2014 regulators cap it via capital and leverage-ratio rules.",insurer:"Insurers often show 15\u201330\xD7 because policyholder liabilities dominate the balance sheet. Look at the solvency ratio for the real capital buffer.",corporate:"Assets \xF7 equity of 1.5\u20133\xD7 is typical. Higher leverage lifts ROE but raises financial risk \u2014 for a non-financial, judge debt with net debt \xF7 EBITDA and interest cover."},benchmark:{bank:"about 12\u201325\xD7",insurer:"about 10\u201330\xD7",corporate:"about 1.5\u20133\xD7"}},{key:"equity_ratio",en:"Equity ratio",de:"Eigenkapitalquote",text:"Shareholders' equity \xF7 total assets \xD7 100 (year-end)",unit:"%",sectors:[" s dividends) is a good long-run measure of value creation for banks.",insurer:"Under IFRS 17 book value excludes the CSM \u2014 some analysts add the after-tax CSM ('adjusted book value').",corporate:"Less informative for non-financials: book value leaves out internally developed assets (R&D pipelines, brands) and shrinks with buybacks, so P/B of 5\u201310\xD7 for pharma says little on its own."},benchmark:{}},{key:"cet1_calc",en:"CET1 ratio (calculated)",de:"Harte Kernkapitalquote (berechnet)",text:"CET1 capital \xF7 risk-weighted assets \xD7 100",unit:"%",sectors:["bank"],higher_is_better:!0,core:!1,cfa:"cet1",inputs:[{metric:"cet1_capital",averaged:!1,opening:!1},{metric:"rwa",averaged:!1,opening:!1}],interpretation:{bank:"The core solvency metric. Compare with the regulatory requirement plus buffers and the bank's own target; excess capital above the target can be returned to shareholders."},benchmark:{bank:"about 12\u201320 % for Swiss/European banks"}},{key:"rwa_density",en:"RWA density",de:"RWA-Dichte",text:"Risk-weighted assets \xF7 total assets \xD7 100",unit:"%",sectors:["bank"],higher_is_better:null,core:!1,cfa:"rwa_density",inputs:[{metric:"rwa",averaged:!1,opening:!1},{metric:"total_assets",averaged:!1,opening:!1}],interpretation:{bank:"Low density (mortgages, Lombard loans, central-bank cash) means less capital per unit of balance sheet; high density means riskier assets (corporate loans, trading)."},benchmark:{bank:"about 20\u201345 %"}},{key:"nii_share",en:"Net interest income share",de:"Anteil Zinserfolg am Gesch\xE4ftsertrag",text:"Net interest income \xF7 total operating income \xD7 100",unit:"%",sectors:["bank"],higher_is_better:null,core:!1,cfa:"revenue_mix",inputs:[{metric:"net_interest_income",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{bank:"A high NII share makes earnings sensitive to interest rates (SNB cuts hurt); a high fee share makes them sensitive to markets and client assets."},benchmark:{}},{key:"fee_share",en:"Fee income share",de:"Anteil Kommissionserfolg am Gesch\xE4ftsertrag",text:"Net fee and commission income \xF7 total operating income \xD7 100",unit:"%",sectors:["bank"],higher_is_better:null,core:!1,cfa:"revenue_mix",inputs:[{metric:"fee_income",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{bank:"Fee income needs little capital, so a high fee share supports high ROE and P/B \u2014 typical of wealth managers."},benchmark:{}},{key:"nnm_growth",en:"Net new money growth",de:"Neugeldwachstum",text:"Net new money \xF7 opening assets under management \xD7 100",unit:"%",sectors:["bank"],higher_is_better:!0,core:!1,cfa:"nnm",inputs:[{metric:"net_new_money",averaged:!1,opening:!1},{metric:"aum",averaged:!1,opening:!0}],interpretation:{bank:"Organic growth of client assets, excluding market performance and acquisitions. Wealth managers target about 3\u20135 % a year."},benchmark:{bank:"targets often 3\u20135 %"}},{key:"insurance_margin",en:"Insurance service margin",de:"Versicherungstechnische Marge",text:"Insurance service result \xF7 insurance revenue \xD7 100 (IFRS 17)",unit:"%",sectors:["insurer"],higher_is_better:!0,core:!1,cfa:"insurance_metrics",inputs:[{metric:"insurance_service_result",averaged:!1,opening:!1},{metric:"insurance_revenue",averaged:!1,opening:!1}],interpretation:{insurer:"Underwriting profitability under IFRS 17 before investment result. For P&C it is roughly 100 % \u2212 combined ratio; for life it reflects CSM release and risk adjustment."},benchmark:{}},{key:"investment_share",en:"Investment income share",de:"Anteil Kapitalanlageertrag",text:"Net investment income \xF7 revenue \xD7 100",unit:"%",sectors:["insurer"],higher_is_better:null,core:!1,cfa:"insurance_metrics",inputs:[{metric:"investment_income",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{insurer:"How dependent the insurer is on investment returns. Life insurers depend heavily on them (spread business vailable for dividends, buybacks, acquisitions and debt repayment. Pharma converts 20\u201330 % of sales into free cash flow; industrials 5\u201310 %."},benchmark:{corporate:"pharma about 20\u201330 %; industrials about 5\u201310 %"}},{key:"net_debt_ebitda",en:"Net debt \xF7 EBITDA",de:"Nettoverschuldung \xF7 EBITDA",text:"(Financial debt \u2212 cash) \xF7 (EBIT + D&A), times",unit:"x",sectors:["corporate"],higher_is_better:!1,core:!1,cfa:"net_debt_ebitda",inputs:[{metric:"total_debt",averaged:!1,opening:!1},{metric:"cash",averaged:!1,opening:!1},{metric:"ebit",averaged:!1,opening:!1},{metric:"depreciation_amortisation",averaged:!1,opening:!1}],interpretation:{corporate:"How many years of operating cash earnings it would take to repay net debt. Below 1.5\xD7 is conservative, 2\u20133\xD7 is common after acquisitions, above 3\u20134\xD7 worries rating agencies. Negative means net cash."},benchmark:{corporate:"about 0\u20132.5\xD7 for strong ratings"}},{key:"roce",en:"Return on capital employed (ROCE)",de:"Rendite auf das eingesetzte Kapital (ROCE)",text:"EBIT \xF7 average capital employed (equity + financial debt \u2212 cash) \xD7 100",unit:"%",sectors:["corporate"],higher_is_better:!0,core:!1,cfa:"roce",inputs:[{metric:"ebit",averaged:!1,opening:!1},{metric:"total_equity",averaged:!0,opening:!1},{metric:"total_debt",averaged:!0,opening:!1},{metric:"cash",averaged:!0,opening:!1}],interpretation:{corporate:"Pre-tax return on all the capital the business uses, regardless of how it is financed \u2014 so buybacks and leverage do not inflate it like ROE. Compare it with the pre-tax cost of capital (WACC grossed up for tax, roughly 8\u201310 %). Hilti reports its own ROCE (2025: 11.8 %)."},benchmark:{corporate:"about 10\u201325 %"}},{key:"gross_margin",en:"Gross margin",de:"Bruttomarge",text:"Gross profit \xF7 revenue \xD7 100",unit:"%",sectors:["corporate"],higher_is_better:!0,core:!1,cfa:"gross_margin",inputs:[{metric:"gross_profit",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{corporate:"Pricing power and production cost. Patented medicines: 70\u201380 %. A falling gross margin points to price pressure, input-cost inflation or a shift to lower-margin products."},benchmark:{corporate:"pharma about 70\u201380 %; tools and industrials about 40\u201365 %"}},{key:"rnd_intensity",en:"R&D intensity",de:"F&E-Quote",text:"R&D expense \xF7 revenue \xD7 100",unit:"%",sectors:["corporate"],higher_is_better:null,core:!1,cfa:"rnd",inputs:[{metric:"rnd_expense",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{corporate:"How much of each franc of sales is reinvested in innovation. Big pharma spends 18\u201325 %; Hilti about 7 %. Cutting R&D lifts today's margin at the expense of tomorrow's growth."},benchmark:{corporate:"pharma about 18\u201325 %; industrials about 3\u20138 %"}},{key:"capex_intensity",en:"Capex intensity",de:"Investitionsquote",text:"Capital expenditure \xF7 revenue \xD7 100",unit:"%",sectors:["corporate"],higher_is_better:null,core:!1,cfa:"capex",inputs:[{metric:"capex",averaged:!1,opening:!1},{metric:"revenue",averaged:!1,opening:!1}],interpretation:{corporate:"How capital-intensive the business is. Compare capex with depreciation: capex persistently below D&A means the asset base is shrinking; well above means expansion."},benchmark:{corporate:"about 3\u20138 %"}},{key:"interest_cover",en:"Interest cover",de:"Zinsdeckungsgrad",text:"EBIT \xF7 interest expense, times",unit:"x",sectors:["corporate"],higher_is_better:!0,core:!1,cfa:"net_debt_ebitda",inputs:[{metric:"ebit",averaged:!1,opening:!1},{metric:"interest_expense",averaged:!1,opening:!1}],interpretation:{corporate:"How many times operating profit covers interest. Above 8\u201310\xD7 is comfortable; below 3\xD7 is a warning sign. It falls quickly when rates or debt rise."},benchmark:{corporate:"above about 8\xD7 for strong ratings"}},{key:"current_ratio",en:"Current ratio",de:"Liquidit\xE4tsgrad 3 (Curr e",zinserfolg:"net_interest_income","fee income":"fee_income","net fee and commission income":"fee_income",kommissionserfolg:"fee_income","cet1 capital":"cet1_capital",cet1:"cet1_capital","cet1 ratio":"cet1_ratio",rwa:"rwa","risk weighted assets":"rwa",aum:"aum","assets under management":"aum","invested assets":"aum","verwaltete vermogen":"aum","verwaltete verm\xF6gen":"aum","net new money":"net_new_money",nnm:"net_new_money","netto neugeld":"net_new_money","cost income ratio":"cost_income_ratio","cost/income ratio":"cost_income_ratio",roe:"roe_reported","return on equity":"roe_reported",premiums:"gross_premiums","gross written premiums":"gross_premiums","insurance revenue":"insurance_revenue","investment income":"investment_income","net investment income":"investment_income","insurance service result":"insurance_service_result","solvency ratio":"solvency_ratio","sst ratio":"solvency_ratio","combined ratio":"combined_ratio",csm:"csm","credit loss expense":"credit_loss_expense",loans:"customer_loans",deposits:"customer_deposits","net sales":"revenue",sales:"revenue",nettoumsatz:"revenue","gross profit":"gross_profit",bruttogewinn:"gross_profit",ebit:"ebit","operating result":"ebit","operating profit":"ebit",betriebsergebnis:"ebit","depreciation and amortisation":"depreciation_amortisation","depreciation and amortization":"depreciation_amortisation",da:"depreciation_amortisation",abschreibungen:"depreciation_amortisation",rd:"rnd_expense","research and development":"rnd_expense","forschung und entwicklung":"rnd_expense","interest expense":"interest_expense",zinsaufwand:"interest_expense",capex:"capex","capital expenditure":"capex",investitionen:"capex","free cash flow":"free_cash_flow",fcf:"free_cash_flow",cash:"cash","cash and cash equivalents":"cash","flussige mittel":"cash","fl\xFCssige mittel":"cash","financial debt":"total_debt","total debt":"total_debt",finanzverbindlichkeiten:"total_debt","current assets":"current_assets",umlaufvermogen:"current_assets",umlaufverm\u00F6gen:"current_assets","current liabilities":"current_liabilities",inventories:"inventories",vorrate:"inventories",vorr\u00E4te:"inventories",receivables:"receivables","trade receivables":"receivables"};var kf={business_model:["Corporate Issuers \xB7 Equity Investments","Understanding the business model, revenue drivers and competitive position is the first step of company analysis (industry and competitive analysis, e.g. Porter's five forces)."],industry_analysis:["Equity Investments","Competitive advantages ('moats') explain whether high returns on equity can persist \u2014 the link between industry structure and valuation."],data_collection:["Financial Statement Analysis","Analysts start from the audited statements and must understand the reporting basis (IFRS vs US GAAP, restatements) before comparing years."],growth_cagr:["Quantitative Methods \xB7 FSA","CAGR is the geometric mean growth rate \u2014 it smooths volatile year-to-year changes, unlike the arithmetic average of growth rates."],trend:["Financial Statement Analysis","Trend (horizontal) analysis compares a line item across periods; always ask whether a change is operational, accounting-driven or one-off."],roe:["Financial Statement Analysis \xB7 Equity","ROE = net income \xF7 average shareholders' equity. CFA uses average balances because income is earned over the whole year."],roa:["Financial Statement Analysis","ROA measures profit per unit of total assets. Banks and insurers have very low ROA (\u22480.3\u20131 %) because their balance sheets are highly leveraged; non-financials typically earn 5\u201315 %."],dupont:["Financial Statement Analysis","DuPont analysis: ROE = net margin \xD7 asset turnover \xD7 financial leverage (= ROA \xD7 leverage). It shows whether ROE comes from profitability or from leverage."],net_margin:["Financial Statement Analysis","Net profit margin links the income statement's top and bottom lines \u2014 for financials, define 'revenue' carefully (operating income, insurance revenue)."],cost_income:["Financial Statement Analysis","Cost/income is the bank-specific efficiency ratio \u2014 the analogue of an operating margin (1 \u2212 cost/income \u2248 pre-provision margin)."],leverage:["Financial Statement Analysis \xB7 Corporate Issuers","Financial leverage (equity multiplier) = average assets \xF7 average equity. Higher leverage amplifies ROE \u2014 and losses."],payout:["Corporate Issuers \xB7 Equity","Payout ratio and retention ratio (b = 1 \u2212 payout) determine sustainable growth: g = b \xD7 ROE."],bvps:["Equity Investments","Book value per share is the anchor for P/B valuation \u2014 most relevant for banks and insurers whose assets are largely financial and marked close to fair value; weak for intangible-rich companies such as pharma."],cet1:["Financial Statement Analysis (financial institutions)","Bank analysis follows CAMELS (capital, asset quality, management, earnings, liquidity, sensitivity). The CET1 ratio is the 'C'."],rwa_density:["Financial Statement Analysis (financial institutions)","RWA density (RWA \xF7 total assets) shows how risky the balance sheet is in regulatory terms \u2014 and how much capital growth will consume."],revenue_mix:["Financial Statement Analysis (financial institutions)","Revenue mix (interest vs fee income) drives earnings quality and sensitivity to interest rates \u2014 the 'E' and 'S' in CAMELS."],nnm:["Equity Investments","Net new money is a leading indicator for wealth managers: it signals future fee income independent of market moves."],insurance_metrics:["Financial Statement Analysis (insurance)","Insurer analysis focuses on underwriting (combined ratio), investment returns, reserves, capital (solvency ratio) and liquidity \u2014 not on industrial working capital."],statement_links:["Financial Statement Analysis","The three statements articulate: net income flows into retained earnings; the cash flow statement reconciles profit to cash; the statement of changes in equity explains every equity movement."],notes:["Financial Statement Analysis","The notes disclose accounting policies, estimates and judgements \u2014 where most quality-of-earnings red flags hide."],auditor:["Financial Statement Analysis","The audit opinion and key audit matters tell you where the auditor saw the highest risk of material misstatement."],quality_earnings:["Financial Statement Analysis","Earnings quality: high-quality earnings are sustainable, cash-backed and free of aggressive estimates or one-offs."],accruals:["Financial Statement Analysis","Accrual ratio = (net income \u2212 operating cash flow) \xF7 average assets. Large accruals signal lower earnings persistence \u2014 for industrial companies, much less for banks."],one_offs:["Financial Statement Analysis","Separate recurring from non-recurring items to estimate 'core' or 'underlying' earnings before forecasting or valuing."],reserves:["Financial Statement Analysis (insurance)","Reserve releases or strengthening (prior-year development) change insurer earnings without any new business \u2014 a classic earnings-management lever."],risk_credit:["Fixed Income","Credit risk = probability of default \xD7 loss given default \xD7 exposure. Expected credit losses (IFRS 9) are the accounting estimate of it."],risk_market:["Portfolio Management \xB7 Fixed Income","Market risk covers equity, interest-rate, credit-spread and FX moves; VaR and stress tests quantify it."],risk_interest:["Fixed Income","Duration measures price sensitivity to rates. Life insurers worry about asset\u2013liability duration gaps; banks about repricing gaps and NII sensitivity."],risk_liquidity:["Fixed Income \xB7 Financial Statement Analysis","Banks: LCR and NSFR; insurers: lapse-driven outflows and collateral calls. Liquidity, not solvency, usually kills banks first (e.g. Credit Suisse 2023)."],risk_operational:["Portfolio Management","Operational risk: losses from failed processes, people, systems or external events \u2014 including conduct and cyber risk."],risk_regulatory:["Economics \xB7 Corporate Issuers","Capital rules (Basel III, SST, Solvency II) determine how much equity a financial firm must hold \u2014 and therefore achievable ROE and payouts."],risk_underwriting:["Financial Statement Analysis (insurance)","Underwriting risk: claims or lapses differ from pricing assumptions (catastrophes, mortality, longevity, lapse)."],risk_concentration:["Portfolio Management","Concentration risk: exposure to one client, region, sector or peril \u2014 the opposite of diversification."],derivatives:["Derivatives","Banks and insurers use derivatives (swaps, options) to hedge interest-rate and market risk \u2014 hedge accounting can create accounting mismatches."],peers:["Equity Investments","Comparable-company analysis only works with truly comparable firms: same business model, accounting basis and currency \u2014 compare ratios, not absolute amounts."],pe:["Equity Investments","P/E = price \xF7 EPS. Use normalised (recurring) earnings \u2014 one-offs distort it."],pb:["Equity Investments","P/B = price \xF7 book value per share. For financials book value is meaningful because assets are mostly financial."],dividend_yield:["Equity Investments","Dividend yield = DPS \xF7 price. Check sustainability via payout ratio and capital generation."],justified_pb:["Equity Investments","Justified P/B = (ROE \u2212 g) \xF7 (r \u2212 g): a firm earning its cost of equity (ROE = r) should trade at book value."],ddm:["Equity Investments","Gordon growth model: V\u2080 = D\u2081 \xF7 (r \u2212 g). Appropriate for mature dividend payers \u2014 very sensitive to r \u2212 g."],residual_income:["Equity Investments","Residual income model: value = book value + PV of (ROE \u2212 r) \xD7 book value. Well suited to financial institutions."],dcf:["Equity Investments \xB7 Corporate Issuers","FCFF/FCFE DCF suits industrial firms. For banks, debt is raw material, not financing, so use FCFE defined as distributable capital, or DDM/RI."],fcff:["Equity Investments \xB7 Corporate Issuers","FCFF = cash flow available to all capital providers. Discount at the WACC to get enterprise value, then subtract net debt (and minorities) to reach equity value."],wacc:["Corporate Issuers","WACC = E/V \xD7 r_e + D/V \xD7 r_d \xD7 (1 \u2212 t). Debt is cheaper than equity after tax, but more debt raises both costs \u2014 the discount rate for FCFF."],ev_ebitda:["Equity Investments","EV/EBITDA compares enterprise value (market cap + net debt) with operating earnings before D&A \u2014 capital-structure neutral, so firms with different debt levels can be compared."],ebit_margin:["Financial Statement Analysis","Operating margin = EBIT \xF7 revenue: profitability before financing and tax, the cleanest margin for comparing companies with different capital structures."],gross_margin:["Financial Statement Analysis","Gross margin reflects pricing power and production cost \u2014 a falling gross margin is often the first sign of competitive pressure."],cash_conversion:["Financial Statement Analysis","Comparing operating cash flow with net income is the simplest earnings-quality test for non-financial companies: persistent shortfalls mean accruals are building up."],fcf:["Equity Investments \xB7 FSA","Free cash flow = operating cash flow \u2212 capital expenditure: the cash available for dividends, buybacks, acquisitions and debt repayment."],net_debt_ebitda:["Fixed Income \xB7 Corporate Issuers","Credit analysts judge leverage with net debt \xF7 EBITDA and coverage with EBIT \xF7 interest \u2014 the core of the 'capacity' C in credit analysis."],roce:["Financial Statement Analysis \xB7 Corporate Issuers","ROCE (or ROIC) measures returns on all capital employed, independent of financing \u2014 value is created only when it exceeds the cost of capital."],rnd:["Financial Statement Analysis","Under IFRS research is expensed and some development is capitalised; R&D intensity shows how much of today's sales is reinvested in future products."],capex:["Corporate Issuers","Capital expenditure versus depreciation shows whether a company is maintaining, shrinking or growing its asset base."],liquidity_ratios:["Financial Statement Analysis","Liquidity ratios (current, quick, cash ratio) measure the ability to meet short-term obligations; working capital ties up cash."],working_capital:["Financial Statement Analysis","Working capital (receivables + inventories \u2212 payables) absorbs cash when sales grow \u2014 and rising days sales outstanding can signal aggressive revenue recognition."],risk_demand:["Economics \xB7 Equity Investments","Cyclical companies' sales follow the business cycle; with high fixed costs (operating leverage) profit swings much more than sales."],risk_competition:["Equity Investments","Porter's five forces: rivalry, substitutes, new entrants, buyer and supplier power determine whether high margins can last."],risk_pricing:["Economics \xB7 Equity Investments","Regulated or negotiated prices (drug pricing, tariffs) shift value from companies to payers and governments \u2014 a political risk to margins."],risk_pipeline:["Equity Investments","Patent expiry ('loss of exclusivity') can erase most of a drug's sales within two years; valuation depends on the pipeline replacing it."],risk_currency:["Economics \xB7 FSA","Currency risk: transaction exposure (costs and sales in different currencies) hits margins; translation exposure changes reported figures."],risk_supply:["Corporate Issuers","Supply-chain and input-cost risk: raw materials, energy and logistics costs squeeze gross margins unless they can be passed on in prices."],risk_legal:["Financial Statement Analysis","Litigation and product-liability risk sits in provisions and contingent liabilities (IAS 37) \u2014 read the legal note."],capm:["Portfolio Management \xB7 Equity","CAPM: r = r_f + \u03B2 \xD7 equity risk premium \u2014 the cost of equity used to discount dividends and residual income."],thesis:["Equity Investments \xB7 P nsurers (no EBITDA, debt is operating). Treat leases and minorities consistently in EV.",cfa:"ev_ebitda"},{key:"dcf",name:"DCF on free cash flow (FCFF at the WACC)",when:"Non-financial companies with clear free cash flow. For financials only if redefined as FCFE = distributable capital.",caution:"Very sensitive to the WACC and terminal growth. For banks, 'debt' is operating raw material and cash flow statements are not informative \u2014 FCFF is inappropriate.",cfa:"dcf"}],bf={bank:["ddm","jpb","pb","ri"],insurer:["ddm","jpb","pb","ri"],corporate:["dcf","ddm","ev_ebitda","pe"]},_f={bank:["dcf","ev_ebitda"],insurer:["dcf","ev_ebitda"],corporate:["jpb","pb"]},Sf=["bank","insurer","corporate"],Cf={bank:"Bank",insurer:"Insurer",corporate:"Non-financial"},vr=[{profile:{id:"gkb",name:"Graub\xFCndner Kantonalbank",short_name:"GKB",sector:"bank",subsector:"Cantonal bank: mortgages, savings, SMEs and private banking in Graub\xFCnden",country:"Switzerland",headquarters:"Chur",listed:!0,exchange_ticker:"GRKP (participation certificates, SIX Swiss Exchange)",currency:"CHF",currency_confirmed:!0,fiscal_year_end:"31 December",accounting:{2021:"Swiss GAAP (banks)",2022:"Swiss GAAP (banks)",2023:"Swiss GAAP (banks)",2024:"Swiss GAAP (banks)",2025:"Swiss GAAP (banks)"},accounting_notes:"Group accounts under the Swiss accounting rules for banks (Banking Ordinance and FINMA accounting rules, true-and-fair view) \u2014 not IFRS. Profit is stated after allocations to or releases from 'reserves for general banking risks', which count as equity and can smooth earnings. The listed participation certificates (Partizipationsscheine, PS) carry dividend rights but no votes; the Canton of Graub\xFCnden owns most of the capital and guarantees the bank's liabilities (Staatsgarantie).",regulator:"FINMA (Swiss Financial Market Supervisory Authority); the canton supervises the owner relationship",capital_regime:"Basel III as implemented in Switzerland (Capital Adequacy Ordinance)",investor_relations:"https://www.gkb.ch",annual_report_hint:"gkb.ch \u2192 \xDCber uns \u2192 Medien und Publikationen \u2192 Kennzahlen und Finanzberichte. The Gesch\xE4ftsbericht contains the group accounts, the notes (incl. reserves for general banking risks) and the capital disclosure.",data_source:"Starter values from a data vendor (FMP via Bigdata.com) and GKB's 2025 results release; sector KPIs are left for you to collect. Unverified \u2014 the vendor's 2025 revenue was wrong, so check every year.",required_extra:[],not_applicable:[],business_reference:{what_it_does:{reference:"GKB is the cantonal bank of Graub\xFCnden, founded in 1870 and majority-owned by the canton. It is the leading bank in the canton: mortgages and savings accounts for private clients, loans to SMEs and tourism businesses, payment services, and investment advice and asset management (also through majority-owned subsidiaries).",key_points:[{point:"Cantonal bank owned by the canton",keywords:["cantonal","kantonal","canton","kanton","state","staat"]},{point:"Mortgages and savings",keywords:["mortgage","hypothek","savings","spar","deposit","einlage"]},{point:"SMEs and tourism businesses",keywords:["sme","kmu","firmen","tourism","tourismus"]},{point:"Investment advice and asset management",keywords:["wealth","private bank","verm\xF6gensverwaltung","asset management","anlage"]}]},how_money:{reference:"Mostly from net interest income \u2014 the margin between mortgage and loan rates and what it pays on savings and deposits (about 60 % of operating income). Fees from securities, advice and payments are the second pillar. Net interest income therefore follows SNB rates: the 2022\u20132023 rate rises helped, the cuts back to 0 % in 2024\u20132025 squeeze margins.",key_points:[{point:"Net interest income (interest margin)",keywords:["interest","zins","margin","nii"]},{point:"Fee and commission income",keywords:["fee","kommission","commission","geb\xFChr","advisory","depot"]},{point:"Dependence on SNB rates",keywords:["snb","rate","leitzins"]}]},segments:{reference:"Retail and SME banking in Graub\xFCnden is the core; private banking and asset management (including subsidiaries) and the treasury/corporate centre complete it. Swiss GAAP banks disclose less segment detail than IFRS banks \u2014 check what the report shows.",key_points:[{point:"Retail and SME banking",keywords:["retail","privatkunden","sme","kmu"]},{point:"Private banking / asset management",keywords:["private bank","asset management","verm\xF6gensverwaltung"]},{point:"Treasury / corporate centre",keywords:["treasury","corporate centre","zentrale"]}]},customers:{reference:"Private households and homeowners in Graub\xFCnden, local SMEs and tourism businesses (hotels, mountain railways), public-sector entities and wealthy private clients.",key_points:[{point:"Households and homeowners",keywords:["private","privat","household","homeowner","eigenheim"]},{point:"SMEs and tourism businesses",keywords:["sme","kmu","hotel","tourism","tourismus","bergbahn"]},{point:"Public sector",keywords:["public","\xF6ffentlich","gemeinde","municipal"]},{point:"Wealthy private clients",keywords:["wealthy","verm\xF6gend","private banking"]}]},markets:{reference:"Mainly the canton of Graub\xFCnden \u2014 an alpine tourism region with many second homes \u2014 plus private banking and asset management elsewhere in Switzerland.",key_points:[{point:"Graub\xFCnden",keywords:["graub\xFCnden","graubuenden","canton","kanton","grisons"]},{point:"Tourism and second homes",keywords:["tourism","tourismus","second home","zweitwohnung"]},{point:"Switzerland",keywords:["switzerland","schweiz"]}]},advantages:{reference:"Dominant local market share and loyal clients, the state guarantee (cheap and stable funding), strong capitalisation and a low-risk mortgage book.",key_points:[{point:"Local market leadership",keywords:["market share","marktanteil","local","lokal","dominant","leader"]},{point:"State guarantee",keywords:["guarantee","garantie"]},{point:"Strong capital",keywords:["capital","kapital","cet1"]},{point:"Low-risk mortgage book",keywords:["mortgage","hypothek","low risk","tiefes risiko"]}]},threats:{reference:"Falling interest rates (SNB at 0 %) compress net interest income; concentration in one regional economy and in residential and holiday real estate; the tourism cycle; competition from digital banks and other banks; political influence of the owner and the fee paid to the canton for the state guarantee.",key_points:[{point:"Falling interest rates",keywords:["rate","zins","snb"]},{point:"Regional and real-estate concentration",keywords:["concentration","klumpen","real estate","immobilien","region"]},{point:"Competition",keywords:["competition","konkurrenz","digital","neobank"]},{point:"Political / owner influence",keywords:["political","politik","canton","kanton","owner"]}]}},events:[{year:2023,metrics:["net_interest_income","revenue","net_income"],nature:"operational",title:"Higher SNB rates lift interest income",detail:"The SNB ended negative rates in 2022 and raised its policy rate to 1.75 % by mid-2023. Net interest income and operating income jumped in 2023.",where_to_verify:"Gesch\xE4ftsbericht 2023: Erfolg aus dem Zinsengesch\xE4ft; management commentary."},{year:2023,metrics:["dps"],nature:"capital",title:"Dividend raised to CHF 47.50 per PS",detail:"The distribution per participation certificate rose from CHF 42.50 to 47.50. Most of it goes to the canton as the majority owner.",where_to_verify:"Gesch\xE4ftsbericht 2023: Gewinnverwendung (appropriation of profit)."},{year:2025,metrics:["net_interest_income","revenue","cost_income_ratio"],nature:"operational",title:"SNB back at 0 % \u2014 interest income falls",detail:"After the SNB cut rates to 0 % (June 2025), net interest income fell 5.4 % to CHF 309.9 m and operating income 2.9 % to CHF 513.2 m; the cost/income ratio rose to 48.0 %.",where_to_verify:"Gesch\xE4ftsbericht 2025 / results release February 2026."}],top_risks_reference:[{risk:"interest_rate",why:"Net interest income is about 60 % of income; with the SNB at 0 % deposit margins shrink, and negative rates would hurt further."},{risk:"concentration",why:"Loans are concentrated in one canton, in residential and holiday real estate and in tourism \u2014 a regional or property downturn would hit the whole book at once."},{risk:"credit",why:"Mortgages are low-risk only while property prices and borrowers' incomes hold; second homes and tourism loans are more cyclical."}],audit_focus:["Valuation of mortgage loans and value adjustments for default risks","Reserves for general banking risks (allocations and releases)","Interest-rate risk in the banking book","IT general controls"],quiz:[{level:1,concept:"business_model",prompt:"What do GKB's listed participation certificates (PS) lack compared with ordinary shares?",options:["Voting rights","Dividend rights","A stock exchange listing","A nominal value"],answer:0,explanation:"PS holders share in profit and dividends but cannot vote \u2014 control stays with the canton."},{level:3,concept:"one_off_items",prompt:"GKB reports under Swiss bank accounting. What are 'reserves for general banking risks'?",options:["Equity reserves the bank can build up or release through the income statement, which can smooth reported profit","Provisions for specific bad loans","Cash held at the SNB","Deposits guaranteed by the canton"],answer:0,explanation:"Allocations reduce profit, releases increase it. Check the note every year: a release can make profit look better than the operating business."}],peers_suggested:["llb","ubs"]},years:[2021,2022,2023,2024,2025],values:{revenue:{2021:438.722,2022:478.191,2023:525.906,2024:528.411,2025:513.2},operating_expenses:{2021:null,2022:null,2023:null,2024:null,2025:null},net_income:{2021:184.23,2022:197.781,2023:218.287,2024:217.46,2025:216.289},total_assets:{2021:32788.597,2022:33253.232,2023:32769.099,2024:35598.061,2025:36307.387},total_liabilities:{2021:29974.384,2022:30384.238,2023 otes:"Consolidated accounts in Swiss francs (confirm the accounting standard in the Financial Report). As a private company Hilti publishes less detail than listed peers: no EPS, no share price, and limited segment information.",regulator:"None specific (industrial company under Liechtenstein company law)",capital_regime:"None \u2014 Hilti targets an equity ratio of at least 45 %",investor_relations:"https://www.hilti.group",annual_report_hint:"hilti.group \u2192 Company \u2192 Media relations / Company report. The Financial Report (PDF) contains the consolidated balance sheet, income statement, cash flow statement and notes.",data_source:"Hilti is not listed and data vendors do not cover it. Starter figures come from Hilti's media releases (some derived from reported growth rates). Collect the balance sheet and cash flows yourself from the Financial Report.",required_extra:[],not_applicable:["eps","dps","shares_outstanding","share_price"],business_reference:{what_it_does:{reference:"Hilti develops, makes and sells professional tools (power tools, measuring systems), fastening and protection systems (anchors, installation systems, firestop) and software and services (tool fleet management, construction software such as Fieldwire) for construction professionals. It was founded in 1941 in Schaan by Martin and Eugen Hilti and has about 34,000 employees.",key_points:[{point:"Professional tools",keywords:["tool","werkzeug","ger\xE4t","power tool"]},{point:"Fastening and protection systems",keywords:["fasten","befestig","anchor","d\xFCbel","firestop","brandschutz","installation"]},{point:"Software and services",keywords:["software","service","fleet","digital","fieldwire"]},{point:"For construction professionals",keywords:["construction","bau","contractor","professional","profi"]}]},how_money:{reference:"Premium prices for high-quality products, sold mainly through its own direct sales force (customer visits, Hilti Stores, online). The direct model is costly but builds loyalty. Fleet management (tools as a service for a monthly fee) and consumables (anchors, drill bits, blades) create recurring revenue. Return on sales is about 11\u201314 %.",key_points:[{point:"Premium pricing and quality",keywords:["premium","price","preis","quality","qualit\xE4t"]},{point:"Direct sales model",keywords:["direct","direkt","sales force","verkauf","store"]},{point:"Recurring revenue: fleet management and consumables",keywords:["fleet","recurring","wiederkehrend","subscription","consumable","verbrauch"]},{point:"Margins / return on sales",keywords:["margin","marge","return on sales"]}]},segments:{reference:"Hilti reports sales by region (Europe, Americas, Asia/Pacific, Eastern Europe/Middle East/Africa) and gives limited business-unit detail \u2014 typical of a private company.",key_points:[{point:"Europe",keywords:["europe","europa"]},{point:"Americas",keywords:["america","amerika","us"]},{point:"Asia/Pacific",keywords:["asia","asien","pacific"]},{point:"Reporting by region",keywords:["region"]}]},customers:{reference:"Construction professionals: general and specialist contractors (electrical, plumbing, HVAC, drywall), large construction companies, and industrial and energy companies doing maintenance.",key_points:[{point:"Contractors",keywords:["contractor","unternehmer","construction","bau"]},{point:"Specialist trades",keywords:["electric","elektro","plumb","sanit\xE4r","hvac","drywall","trockenbau"]},{point:"Industrial and energy customers",keywords:["industrial","industrie","energy","energie"]}]},markets:{reference:"Global (more than 120 countries). Europe is the largest region (about half of sales), followed by the Americas, mainly the US; Asia/Pacific and EEMEA are smaller. Many costs are in CHF and EUR, so a strong franc reduces reported sales and profit.",key_points:[{point:"Europe",keywords:["europe","europa"]},{point:"Americas / US",keywords:["america","amerika","us","usa"]},{point:"Asia and other regions",keywords:["asia","asien","china","middle east"]},{point:"Currency effects",keywords:["currency","franc","franken","chf","fx"]}]},advantages:{reference:"A strong brand and reputation for quality, direct customer relationships and data, continuous innovation (70+ new products and services a year), lock-in through fleet management, and a very solid balance sheet owned by a long-term family trust.",key_points:[{point:"Brand and quality",keywords:["brand","marke","reputation","quality","qualit\xE4t"]},{point:"Direct customer relationships",keywords:["direct","direkt","relationship","beziehung"]},{point:"Innovation",keywords:["innovat","r&d","forschung","new product"]},{point:"Long-term owner and strong balance sheet",keywords:["trust","family","familie","long-term","langfrist","equity","eigenkapital"]}]},threats:{reference:"Construction downturns (housing and commercial, high interest rates), the strong Swiss franc, competition from cheaper or cordless-specialist brands (Milwaukee/TTI, DeWalt/Stanley Black & Decker, Bosch, Makita), tariffs and trade tensions, raw-material and logistics costs, and the high fixed cost of the direct sales model.",key_points:[{point:"Construction cycle",keywords:["construction","bau","cycle","zyklus","downturn","interest rate"]},{point:"Strong Swiss franc",keywords:["franc","franken","chf","currency","fx"]},{point:"Competition",keywords:["competition","konkurrenz","milwaukee","dewalt","bosch","makita"]},{point:"Tariffs and input costs",keywords:["tariff","zoll","raw material","rohstoff","cost"]}]}},events:[{year:2021,metrics:["ebit","net_income"],nature:"operational",title:"Record year after the pandemic",detail:"Sales grew 12 % and the operating result reached a record CHF 847 m (return on sales 14.2 %) as construction recovered.",where_to_verify:"Hilti Company/Financial Report 2021."},{year:2022,metrics:["free_cash_flow","operating_cash_flow","ebit"],nature:"operational",title:"Negative free cash flow",detail:"Free cash flow was \u2212CHF 147 m: the operating result fell 14 :"IFRS group accounts in US dollars although Novartis is a Swiss company \u2014 and the dividend is declared in Swiss francs. Alcon (eye care) was spun off in 2019 and Sandoz (generics) in October 2023: restated figures show 'continuing operations', but older balance sheets and cash flows still include Sandoz. Novartis also reports 'core' results.",regulator:"Swissmedic, US FDA, EMA (product approvals); SIX and the US SEC (Form 20-F)",capital_regime:"None (non-financial company): the constraints are leverage, the credit rating and the cash needed for R&D, acquisitions, dividends and buybacks",investor_relations:"https://www.novartis.com/investors",annual_report_hint:"novartis.com \u2192 Investors \u2192 Financial data \u2192 Annual Report and Form 20-F. The consolidated financial statements are in the Annual Report; the 20-F has the most detailed risk factors.",data_source:"Starter values from a data vendor (FMP via Bigdata.com). Dividends converted from CHF to USD using dividends paid in the cash flow statement. Unverified \u2014 check each number.",required_extra:[],not_applicable:[],business_reference:{what_it_does:{reference:"Novartis discovers, develops and sells innovative prescription medicines. After spinning off Alcon (2019) and Sandoz (2023) it focuses on four therapeutic areas \u2014 cardiovascular-renal-metabolic, immunology, neuroscience and oncology \u2014 and on technology platforms such as RNA therapeutics, cell and gene therapy and radioligand therapy.",key_points:[{point:"Innovative prescription medicines",keywords:["innovative","medicine","medikament","pharma","drug"]},{point:"Four focus therapeutic areas",keywords:["cardio","immunolog","neuro","oncolog","onkolog"]},{point:"Spin-offs of Alcon and Sandoz",keywords:["sandoz","alcon","spin","abspaltung"]},{point:"Technology platforms",keywords:["rna","gene","cell","zell","radioligand","platform"]}]},how_money:{reference:"By selling patented medicines at high gross margins (about 75 %). Large brands such as Entresto, Cosentyx, Kesimpta, Kisqali and Pluvicto drive growth. Profits fund R&D (about 20 % of sales), dividends and large share buybacks. A brand earns most until its patent expires; then generics take most of the volume.",key_points:[{point:"Patented brands",keywords:["patent","brand","marke","entresto","cosentyx","kisqali","kesimpta"]},{point:"High gross margins",keywords:["margin","marge"]},{point:"R&D reinvestment",keywords:["r&d","research","forschung"]},{point:"Patent expiry / loss of exclusivity",keywords:["expir","generic","generika","exclusivity","loe"]}]},segments:{reference:"One reportable segment (Innovative Medicines) since 2023, run through two commercial units \u2014 US and International. Sales are also shown by therapeutic area and by brand.",key_points:[{point:"Innovative Medicines",keywords:["innovative medicines"]},{point:"US and International units",keywords:["us","international"]},{point:"Therapeutic areas",keywords:["therapeutic","therapie"]},{point:"Brands",keywords:["brand","entresto","cosentyx"]}]},customers:{reference:"Patients reached through doctors and hospitals; payers (governments, health insurers, US pharmacy benefit managers) negotiate prices and rebates; wholesalers distribute the products.",key_points:[{point:"Payers",keywords:["payer","insurer","versicher","government","staat","pbm","medicare"]},{point:"Doctors and hospitals",keywords:["doctor","arzt","hospital","spital","physician"]},{point:"Wholesalers",keywords:["wholesal","grossh\xE4ndler","distribut"]}]},markets:{reference:"Global. The US is the largest and fastest-growing market (about 40 % of sales), followed by Europe, Japan, China and other emerging markets. Reporting in USD means CHF-based costs and EUR sales create currency effects.",key_points:[{point:"United States",keywords:["us","usa","united states","amerika"]},{point:"Europe",keywords:["europe","europa"]},{point:"China / emerging markets",keywords:["china","emerging","asia","asien"]},{point:"Currency effects",keywords:["currency","w\xE4hrung","fx","dollar"]}]},advantages:{reference:"A focused portfolio with several multi-billion blockbusters, a strong US commercial presence, platform technologies (radioligands, siRNA), a large R&D budget and strong cash generation that funds bolt-on acquisitions and buybacks.",key_points:[{point:"Blockbusters",keywords:["blockbuster","brand","entresto","kisqali"]},{point:"Platform technologies",keywords:["platform","radioligand","rna"]},{point:"Cash generation",keywords:["cash","free cash flow","fcf"]},{point:"Bolt-on acquisitions",keywords:["acquisition","akquisition","bolt-on","\xFCbernahme"]}]},threats:{reference:"Loss of exclusivity \u2014 US generic versions of Entresto launched in 2025 and other brands follow; US drug-pricing reform (IRA negotiation includes Entresto), most-favoured-nation pricing and tariffs; pipeline setbacks; integration risk of acquisitions; currency.",key_points:[{point:"Loss of exclusivity",keywords:["entresto","generic","generika","patent","exclusivity"]},{point:"Pricing reform and tariffs",keywords:["ira","pricing","preis","mfn","tariff"]},{point:"Pipeline setbacks",keywords:["pipeline","trial","studie"]},{point:"Acquisition risk",keywords:["acquisition","akquisition","integration"]}]}},events:[{year:2021,metrics:["net_income","eps"],nature:"one-off",title:"Sale of the Roche stake",detail:"Novartis sold its 33 % stake in Roche back to Roche for about USD 20.7 bn and booked a gain of about USD 14.6 bn. Net income of USD 24 bn in 2021 is therefore not a sustainable level.",where_to_verify:"Annual Report 2021: income from associated companies; cash flow from investing activities."},{year:2023,metrics:["revenue","net_income","total_equity","total_assets","operating_cash_flow"],nature:"structural",title:"Spin-off of Sandoz (4 October 2023)",detail:"The generics business was distributed to shareholders. Revenue is restated to continuing operations; net income 2023 contains a large gain on the distribution (
