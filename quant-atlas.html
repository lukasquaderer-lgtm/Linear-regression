function heroAnim() {
  const cv = $('#heroCv'); if (!cv) return null;
  const r = rng(4); const pts = Array.from({ length: 46 }, () => { const x = r() * 10; return [x, 1.5 + 0.7 * x + gauss(r) * 1.3]; });
  const o = ols1(pts.map(p => p[0]), pts.map(p => p[1]));
  return () => {
    const { ctx, w, h } = setupCanvas(cv, 0.72, 200, 320);
    const F = frame(ctx, w, h, [0, 10], [-1, 11], { nx: 5, ny: 4, m: { l: 30 } });
    F.clip();
    pts.forEach(p => { const yh = o.b0 + o.b1 * p[0]; ctx.globalAlpha = 0.35; line(ctx, [[F.X(p[0]), F.Y(p[1])], [F.X(p[0]), F.Y(yh)]], F.C.amber, 1); ctx.globalAlpha = 1; });
    pts.forEach(p => dot(ctx, F.X(p[0]), F.Y(p[1]), 3.4, F.C.muted));
    line(ctx, [[F.X(0), F.Y(o.b0)], [F.X(10), F.Y(o.b0 + o.b1 * 10)]], F.C.accent, 3);
    F.unclip();
    ctx.fillStyle = F.C.ink; ctx.font = '600 12px ' + F.C.mono; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`Ŷ = ${o.b0.toFixed(2)} + ${o.b1.toFixed(2)}X   R² = ${o.r2.toFixed(2)}`, F.m.l + 8, F.m.t + 6);
  };
}

function chooserView() {
  return `<article class="topic"><header class="t-head"><p class="eyebrow">Practice and reference</p><h1>Model chooser</h1><p class="lede">Which technique fits the problem? Answer a few questions. This follows the selection logic the CFA curriculum uses for machine learning algorithms.</p></header>

}
function runChooser() {
  const root = $('#chooser'); const path = [];
  const show = id => {
    const n = TREE[id];
    const trail = path.length ? `<div class="trail">${path.map(p => `<span>${p}</span>`).join('')}</div>` : '';
    if (n.leaf) {
      root.innerHTML = trail + `<div class="qcard leaf"><p class="eyebrow">Recommended</p><h2>${n.leaf}</h2><p>${n.why}</p><div class="btns"><a class="btn primary" href="#${n.link}">Study ${TOPIC_BY_ID[n.link].title}</a><button class="btn" id="chRestart">Start over</button></div></div>`;
      $('#chRestart').onclick = () => { path.length = 0; show('start'); };
      return;
    }
    root.innerHTML = trail + `<div class="qcard"><p class="eyebrow">Question ${path.length + 1}</p><h2>${n.q}</h2><div class="opts">${n.o.map((o, i) => `<button class="opt" data-i="${i}"><b>${o[0]}</b>${o[1] ? `<span>${o[1]}</span>` : ''}</button>`).join('')}</div>${path.length ? '<div><button class="btn small" id="chRestart">Start over</button></div>' : ''}</div>`;
    $$('.opt', root).forEach(b => b.onclick = () => { const o = n.o[+b.dataset.i]; path.push(o[0]); show(o[2]); });
    const rs = $('#chRestart'); if (rs) rs.onclick = () => { path.length = 0; show('start'); };
  };
  show('start');
}

function bindFormulas() {

}

function quizView() {
  return `<article class="topic"><header class="t-head"><p class="eyebrow">Practice and reference</p><h1>Practice questions</h1><p class="lede">Exam-style multiple choice. Pick an answer to see the worked solution.</p>
    <div class="quiz-bar"><div class="filters" style="margin:0"><label for="qzF" class="eyebrow">Topic</label><select id="qzF"><option value="">All topics (${QUIZ.length})</option>${GROUPS.map(g => `<optgroup label="${g.name}">${TOPICS.filter(t => t.g === g.id).map(t => `<option value="${t.id}">${t.title} (${QUIZ.filter(q => q[0] === t.id).length})</option>`).join('')}</optgroup>`).join('')}</select><button class="btn small" id="qzShuf">Shuffle</button><button class="btn small" id="qzReset">Reset</button></div>
    <span class="score" id="qzScore"></span></div></header><div class="qlist" id="qzList"></div></article>`;
}
function bindQuiz() {
  let order = QUIZ.map((_, i) => i); const ans = {};
  const draw = () => {
    const f = $('#qzF').value; const ids = order.filter(i => !f || QUIZ[i][0] === f);
    $('#qzList').innerHTML = ids.map((qi, n) => { const [tid, stem, opts, a, why] = QUIZ[qi]; const chosen = ans[qi];
      return `<div class="q" data-q="${qi}"><p class="eyebrow">${n + 1} · ${TOPIC_BY_ID[tid].title}</p><p class="stem">${stem}</p><div class="opts">${opts.map((o, j) => { const cls = chosen == null ? '' : j === a ? 'right' : j === chosen ? 'wrong' : ''; return `<button class="opt ${cls}" data-j="${j}" ${chosen != null ? 'disabled' : ''}><span class="l">${'ABCD'[j]}</span><span>${o}</span></button>`; }).join('')}</div>${chosen != null ? `<p class="why ${chosen === a ? '' : 'miss'}"><b>${chosen === a ? 'Correct.' : 'Not quite. Answer: ' + 'ABCD'[a] + '.'}</b> ${why} <a href="#${tid}">Review topic</a></p>` : ''}</div>`; }).join('');
    $$('.q').forEach(qe => $$('.opt', qe).forEach(b => b.onclick = () => { ans[+qe.dataset.q] = +b.dataset.j; draw(); }));
    const done = ids.filter(i => ans[i] != null); const right = done.filter(i => ans[i] === QUIZ[i][3]).length;
    $('#qzScore').textContent = `${right} correct of ${done.length} answered · ${ids.length} shown`;
  };
  $('#qzF').onchange = draw;
  $('#qzShuf').onclick = () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } draw(); };
  $('#qzReset').onclick = () => { for (const k in ans) delete ans[k]; order = QUIZ.map((_, i) => i); draw(); };
  draw();
}

function route() {
  let id = (location.hash || '').slice(1);
  const vm = id.match(/^vig(\d+)$/), vigIdx = vm ? +vm[1] - 1 : -1;
  if (vigIdx >= 0 && vigIdx < VIGNETTES.length) id = 'vignettes'; else if (!ROUTES.includes(id)) id = 'home';
  store.set('qma-last', id);
  renderNav(id); $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  const main = $('#main'); currentRedraw = null; clearInterval(vigTimer); vigTimer = null;
  const t = TOPIC_BY_ID[id];
  if (t) {
    main.innerHTML = topicView(t);
    if (t.lab) currentRedraw = LABS[t.lab].init($('#lab'));
    $('#markBtn').onclick = () => { if (mastered.has(t.id)) mastered.delete(t.id); else mastered.add(t.id); store.set('qma-mastered', [...mastered]); const b = $('#markBtn'); b.classList.toggle('on', mastered.has(t.id)); b.textContent = mastered.has(t.id) ? '✓ Understood' : 'Mark as understood'; renderNav(id); };
  } else if (id === 'setup') { main.innerHTML = setupView(); }
  else if (id === 'vignettes') { if (vigIdx >= 0 && vigIdx < VIGNETTES.length) { openVignette(vigIdx); return; } main.innerHTML = vignettesView(); }
  else if (id === 'workbench') { main.innerHTML = workbenchView(); currentRedraw = initWorkbench(); }
  else if (id === 'chooser') { main.innerHTML = chooserView(); runChooser(); }
  else if (id === 'formulas') { main.innerHTML = formulasView(); bindFormulas(); }
  else if (id === 'quiz') { main.innerHTML = quizView(); bindQuiz(); }
  else if (id === 'atlas') { main.innerHTML = atlasView(); bindAtlas(); }
  else { main.innerHTML = homeView(); currentRedraw = heroAnim(); if (currentRedraw) currentRedraw(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#menuBtn').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
let rt; const redraw = () => { clearTimeout(rt); rt = setTimeout(() => currentRedraw && currentRedraw(), 80); };
new ResizeObserver(redraw).observe($('#main'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
route();
</script>
