ting:{2021:"Local GAAP (Liechtenstein)",2022:"Local GAAP (Liechtenstein)",2023:"Local GAAP (Liechtenstein)",2024:"Local GAAP (Liechtenstein)",2025:"Local GAAP (Liechtenstein)"},accounting_notes:"Statutory accounts under Liechtenstein law (not IFRS) \u2014 so there is no IFRS 17 insurance revenue or CSM. Solvency II applies (EEA), so a Solvency and Financial Condition Report (SFCR) is published. Confirm the reporting currency and accounting basis in the Gesch\xE4ftsbericht.",regulator:"FMA Liechtenstein (Finanzmarktaufsicht)",capital_regime:"Solvency II (EEA)",investor_relations:"https://www.prismalife.com",annual_report_hint:"prismalife.com \u2192 \xDCber uns / Unternehmen \u2192 Gesch\xE4ftsberichte and SFCR (Bericht \xFCber Solvabilit\xE4t und Finanzlage). Public information is limited \u2014 this is part of the exercise.",data_source:"No starter data: PrismaLife is not listed and data vendors do not cover it. Collect every figure yourself from the Gesch\xE4ftsbericht and the SFCR.",required_extra:["gross_premiums","solvency_ratio","aum"],not_applicable:["eps","dps","shares_outstanding","share_price","insurance_revenue","insurance_service_result","combined_ratio","csm","roe_reported"],business_reference:{what_it_does:{reference:"PrismaLife is a life insurer in Ruggell, Liechtenstein, founded in 2000. It specialises in unit-linked life and pension insurance (fondsgebundene Lebens- und Rentenversicherungen), largely sold as 'net policies' (Nettopolicen) through independent brokers and fee-based advisers, mainly in Germany. Barmenia became a shareholder in 2020 and took a 75.1 % majority in February 2023. (Public information is limited \u2014 check against the company's own documents.)",key_points:[{point:"Unit-linked life and pension insurance",keywords:["unit-linked","unit linked","fondsgebunden","fund","fonds","pension","rente","life","leben"]},{point:"Net policies via independent brokers",keywords:["net polic","nettopolice","broker","makler","advis","berater","honorar","fee-based"]},{point:"Liechtenstein insurer serving Germany",keywords:["liechtenstein","germany","deutschland","cross-border","grenz\xFCberschreitend"]},{point:"Owned by Barmenia",keywords:["barmenia","parent","mutter","majority","mehrheit"]}]},how_money:{reference:"In unit-linked business the policyholder bears the investment risk. The insurer earns contract charges (administration charges and fees as a percentage of fund assets and contributions), risk premiums for biometric covers (death, disability) and income on its own investments. With net policies the advice fee is paid separately to the broker, so the policy carries low acquisition costs.",key_points:[{point:"Charges on contracts and fund assets",keywords:["charge","kosten","fee","geb\xFChr","gebuehr","asset-based","verwaltungskosten"]},{point:"Risk premiums for biometric cover",keywords:["risk premium","risikopr\xE4mie","risikopraemie","biometr","death","todesfall","disability","berufsunf\xE4hig"]},{point:"Policyholder bears the investment risk",keywords:["investment risk","anlagerisiko","policyholder","versicherungsnehmer"]}]},segments:{reference:"Essentially one business line: unit-linked life and pension insurance. In Solvency II reporting this is the line of business 'index-linked and unit-linked insurance'. Check the annual report and SFCR for any split by product or market.",key_points:[{point:"Unit-linked insurance as the single main line",keywords:["unit-linked","unit linked","fondsgebunden","index-linked","one line","single"]}]},customers:{reference:"Retail clients (private savers) acquired via independent brokers and fee-based advisers (B2B2C). The brokers are the direct 'customers' of the distribution model.",key_points:[{point:"Retail savers",keywords:["retail","private","privat","saver","sparer","consumer"]},{point:"Brokers / advisers as distribution partners",keywords:["broker","makler","advis","berater","intermediar","vermittler"]}]},markets:{reference:"Mainly Germany, plus other EEA markets served cross-border from Liechtenstein under the freedom to provide services (Solvency II passport). Verify the market split in the annual report.",key_points:[{point:"Germany",keywords:["germany","deutschland"]},{point:"Cross-border EEA business",keywords:["eea","ewr","cross-border","grenz\xFCberschreitend","dienstleistungsfreiheit","passport","austria","\xF6sterreich"]}]},advantages:{reference:"Specialisation in net (fee-based) unit-linked policies; flexibility and fund choice; the Liechtenstein EEA passport and a stable jurisdiction; low capital intensity because investment risk sits with policyholders; a strong strategic shareholder (Barmenia).",key_points:[{point:"Specialist in net policies",keywords:["net polic","nettopolice","special","nische","niche"]},{point:"Low capital intensity",keywords:["capital","kapital","solvency","light"]},{point:"Liechtenstein / EEA access",keywords:["liechtenstein","eea","ewr","passport"]},{point:"Strategic shareholder",keywords:["barmenia","shareholder","aktion\xE4r","aktionaer"]}]},threats:{reference:"Lapse and surrender risk; market downturns reducing asset-based charges; dependence on the broker channel and on German regulation of commissions vs fees; competition from large German insurers and low-cost ETF savings plans; expense ratio given limited scale; regulatory change (Solvency II review, consumer protection / value-for-money rules).",key_points:[{point:"Lapse / surrender",keywords:["lapse","storno","surrender","r\xFCckkauf","rueckkauf","cancel","k\xFCndig"]},{point:"Market downturn",keywords:["market","markt","crash","downturn"]},{point:"Distribution dependence and regulation",keywords:["broker","makler","commission","provision","regulat","regulier"]},{point:"Competition (incl. ETFs)",keywords:["competition","wettbewerb","etf"]},{point:"Cost / scale",keywords:["cost","kosten","scale","gr\xF6sse","groesse"]}]}},events:[{year:2023,metrics:[],nature:"structural",title:"Barmenia takes a majority stake (75.1 %)",detail:"A change of control can affect strategy, distribution, capital policy and dividends to the parent. Check the annual report for any effects (e.g. integration costs, new products, capital measures).",where_to_verify:"Gesch\xE4ftsbericht 2023: Lagebericht (management report); SFCR section A (business and performance)."}],top_risks_reference:[{risk:"underwriting",why:"Lapse risk is usually the dominant life underwriting risk for unit-linked business: early cancellations destroy the future charges that pay back acquisition and administration costs."},{risk:"market",why:"Charges are a percentage of fund assets; falling markets shrink the fee base (policyholders bear the investment loss, but the insurer loses income)."},{risk:"operational",why:"Expense risk and operational/regulatory risk for a small insurer distributing cross-border through brokers (conduct, consumer-protection rules, IT)."}],audit_focus:["Measurement of technical provisions (statutory) and deferred acquisition costs, if any","Valuation of investments for the account of policyholders","Completeness and accuracy of premium and charge income (IT systems)"],quiz:[{level:2,concept:"business_model",prompt:"In PrismaLife's unit-linked business, who bears the investment risk of the underlying funds?",options:["The policyholder","PrismaLife's shareholders","The broker","The Liechtenstein state"],answer:0,explanation:"That is why unit-linked insurers need relatively little solvency capital for market risk \u2014 but their fee income still falls when markets fall."},{level:3,concept:"valuation_methods",prompt:"PrismaLife is not listed. Which approach is most practical to estimate its equity value?",options:["Apply P/B or P/E multiples of listed life insurers and adjust, or use a dividend/capital-generation model","Use its own P/E ratio from the stock exchange","Use the dividend yield quoted on SIX","It cannot be valued at all"],answer:0,explanation:"Private companies have no market price \u2014 analysts use comparable-company multiples, transaction multiples (e.g. Barmenia's purchase) or intrinsic models."}],peers_suggested:["swiss_life"]},years:[2021,2022,2023,2024,2025],values:{revenue:{2021:null,2022:null,2023:null,2024:null,2025:null},net_income:{2021:null,2022:null,2023:null,2024:null,2025:null},total_assets:{2021:null,2022:null,2023:null,2024:null,2025:null},total_liabilities:{2021:null,2022:null,2023:null,2024:null,2025:null},total_equity:{2021:null,2022:null,2023:null,2024:null,2025:null},operating_cash_flow:{2021:null,2022:null,2023:null,2024:null,2025:null},gross_premiums:{2021:null,2022:null,2023:null,2024:null,2025:null},investment_income:{2021:null,2022:null,2023:null,2024:null,2025:null},solvency_ratio:{2021:null,2022:null,2023:null,2024:null,2025:null},aum:{2021:null,2022:null,2023:null,2024:null,2025:null}},meta:{revenue:{source:"To collect from the Gesch\xE4ftsbericht",note:"Total income \u2013 define it consistently (e.g. gross premiums + investment result)."},net_income:{source:"To collect from the Gesch\xE4ftsbericht",note:"Jahresgewinn."},total_assets:{source:"To collect from the Gesch\xE4ftsbericht",note:""},total_liabilities:{source:"To collect from the Gesch\xE4ftsbericht",note:""},total_equity:{source:"To collect from the Gesch\xE4ftsbericht",note:""},operating_cash_flow:{source:"To collect from the Gesch\xE4ftsbericht",note:"If a cash flow statement is published."},gross_premiums:{source:"To collect from the Gesch\xE4ftsbericht",note:"Gebuchte Bruttopr\xE4mien."},investment_income:{source:"To collect from the Gesch\xE4ftsbericht",note:"Ertrag aus Kapitalanlagen (own account \u2013 not policyholder funds)."},solvency_ratio:{source:"To collect from the SFCR",note:"Solvency II ratio (Bericht \xFCber Solvabilit\xE4t und Finanzlage)."},aum:{source:"To collect from the Gesch\xE4ftsbericht",note:"Investments for the account of policyholders (Kapitalanlagen f\xFCr Rechnung und Risiko von Inhabern von Lebensversicherungspolicen)."}}},{profile:{id:"roche",name:"Roche Holding AG",short_name:"Roche",sector:"corporate",subsector:"Pharmaceuticals and diagnostics",country:"Switzerland",headquarters:"Basel",listed:!0,exchange_ticker:"ROG (non-voting equity securities) and RO (bearer shares), SIX Swiss Exchange",currency:"CHF",currency_confirmed:!0,fiscal_year_end:"31 December",accounting:{2021:"IFRS",2022:"IFRS",2023:"IFRS",2024:"IFRS",2025:"IFRS"},accounting_notes:"IFRS group accounts in Swiss francs. Roche steers the business on 'core' results, which exclude amortisation and impairment of intangible assets, restructuring and some legal items; the dividend is based on core EPS. Chugai (Japan, about 60 % owned) is fully consolidated, which creates large non-controlling interests.",regulator:"Swissmedic, US FDA, EMA (product approvals); SIX Exchange Regulation (listing)",capital_regime:"None (non-financial company): the constraints are leverage, a strong credit rating and the cash needed for R&D, acquisitions and the dividend",investor_relations:"https://www.roche.com/investors",annual_report_hint:"roche.com \u2192 Investors \u2192 Annual Report. The 'Finance Report' contains the IFRS consolidated financial statements, the notes and the reconciliation from IFRS to core results.",data_source:"Starter values from a data vendor (FMP via Bigdata.com) and Roche results releases; per-ADR figures converted to per-share figures. Unverified \u2014 check each number in the Finance Report.",required_extra:[],not_applicable:[],business_reference:{what_it_does:{reference:"Roche is one of the world's largest healthcare companies and the leader in in-vitro diagnostics. It researches, develops, makes and sells prescription medicines (Pharmaceuticals division, about three quarters of sales) and diagnostic instruments, tests and software (Diagnostics division). Oncology, immunology, neuroscience and ophthalmology are key areas. Genentech (US) and Chugai (Japan) belong to the group.",key_points:[{point:"Prescription medicines (Pharmaceuticals)",keywords:["pharma","medicine","medikament","drug","arznei"]},{point:"Diagnostics",keywords:["diagnost","test","labor"]},{point:"Research-driven / innovative",keywords:["research","forschung","innovat","r&d","biotech","pipeline"]},{point:"Genentech and Chugai",keywords:["genentech","chugai"]}]},how_money:{reference:"By selling patented medicines at prices that reflect their innovation: high gross margins fund heavy R&D (about 20 % of sales). Diagnostics earns from instruments placed in laboratories and the recurring sale of tests and reagents (a 'razor and blade' model). Royalties and licences add income. When patents expire, biosimilars or generics take share quickly.",key_points:[{point:"Patented medicines with high margins",keywords:["patent","margin","marge","pricing","preis"]},{point:"Recurring sales of diagnostic tests and reagents",keywords:["recurring","reagent","reagenz","test","installed base","razor"]},{point:"Reinvestment in R&D",keywords:["r&d","research","forschung","pipeline"]},{point:"Patent expiry and biosimilars",keywords:["biosimilar","generic","generika","patent expir","patentablauf"]}]},segments:{reference:"Two divisions: Pharmaceuticals (Roche Pharmaceuticals including Genentech, and Chugai) and Diagnostics (Core Lab, Molecular Lab, Near Patient Care, Pathology Lab).",key_points:[{point:"Pharmaceuticals",keywords:["pharma"]},{point:"Diagnostics",keywords:["diagnost"]},{point:"Chugai",keywords:["chugai"]},{point:"Genentech",keywords:["genentech"]}]},customers:{reference:"Patients reached through doctors and hospitals, with governments and health insurers paying and negotiating prices; hospital and commercial laboratories buy diagnostic systems and tests.",key_points:[{point:"Payers: governments and health insurers",keywords:["insurer","versicher","krankenkasse","government","staat","payer","medicare"]},{point:"Doctors and hospitals",keywords:["hospital","spital","klinik","doctor","arzt","physician"]},{point:"Laboratories",keywords:["lab","labor"]}]},markets:{reference:"Global. The United States is the largest market (about half of pharma sales), followed by Europe, Japan and international markets including China. Sales are earned in many currencies while much of the cost base is in Switzerland, so a strong Swiss franc reduces reported figures.",key_points:[{point:"United States",keywords:["us","usa","united states","amerika"]},{point:"Europe",keywords:["europe","europa"]},{point:"Japan, China and other international markets",keywords:["japan","china","asia","asien","international"]},{point:"Currency effects (CHF reporting)",keywords:["currency","w\xE4hrung","chf","franc","franken","fx"]}]},advantages:{reference:"Deep oncology and biologics expertise, a large late-stage pipeline, the leading position in diagnostics with a large installed base of instruments, global scale in R&D and commercialisation, the Genentech research engine and a strong balance sheet.",key_points:[{point:"Pipeline and R&D capability",keywords:["pipeline","r&d","research","forschung"]},{point:"Diagnostics leadership / installed base",keywords:["diagnost","installed base","leader","marktf\xFChrer"]},{point:"Global scale",keywords:["scale","size","global","gr\xF6sse","gr\xF6\xDFe"]},{point:"Financial strength",keywords:["balance sheet","bilanz","rating","cash","financial strength"]}]},threats:{reference:"US drug-pricing pressure (Inflation Reduction Act negotiations, the most-favoured-nation pricing push, tariffs), biosimilar erosion of older antibodies, clinical-trial failures, healthcare pricing reforms in China (diagnostics), competition in new areas such as obesity, and the strong Swiss franc.",key_points:[{point:"Drug-pricing pressure and tariffs",keywords:["pricing","preis","ira","mfn","tariff","zoll"]},{point:"Biosimilars and patent expiry",keywords:["biosimilar","generic","patent"]},{point:"Clinical-trial failures",keywords:["trial","studie","failure","pipeline"]},{point:"Strong Swiss franc",keywords:["currency","franc","franken","chf","fx"]},{point:"China pricing reforms",keywords:["china"]}]}},events:[{year:2021,metrics:["shares_outstanding","total_debt","total_equity"],nature:"capital",title:"Buy-back of Novartis's 33 % stake in Roche",detail:"Roche bought back the 53.3 m bearer shares held by Novartis for about CHF 19 bn, financed largely with new debt. The share count fell by about 6 % and debt rose \u2014 EPS benefits, the balance sheet becomes more leveraged.",where_to_verify:"Annual Report 2021: statement of changes in equity (own equity instruments), financing cash flows, debt note."},{year:2023,metrics:["revenue","ebit","net_income"],nature:"operational",title:"COVID-19 test sales fall away",detail:"COVID-19 tests had boosted Diagnostics in 2021\u20132022. Their collapse in 2023, plus a strong franc, cut Group sales by about 7 % in CHF although the base business grew at constant exchange rates.",where_to_verify:"Annual Report 2023: Diagnostics divisional review; sales growth at constant exchange rates (CER) vs CHF."},{year:2023,metrics:["total_assets","total_debt"],nature:"acquisition",title:"Acquisition of Telavant (\u2248 USD 7.1 bn upfront)",detail:"Roche bought Telavant for the rights to an antibody for inflammatory bowel disease. Acquired product rights are booked as intangible assets \u2014 future impairment risk if trials fail.",where_to_verify:"Finance Report 2023: note on acquisitions / intangible assets."},{year:2024,metrics:["net_income","ebit","rnd_expense"],nature:"one-off",title:"Goodwill and intangible-asset impairments",detail:"Impairments (including goodwill from the Spark Therapeutics acquisition) cut IFRS net income to CHF 8.3 bn. Core results exclude them, so core EPS kept growing \u2014 a textbook IFRS vs 'core' gap.",where_to_verify:"Finance Report 2024: goodwill and intangible assets notes; reconciliation of IFRS to core results."},{year:2025,metrics:["revenue","net_income"],nature:"currency",title:"Strong growth at constant rates, much less in CHF",detail:"Sales grew 7 % at constant exchange rates but only about 2 % in CHF. IFRS net income rose about 50 % because the 2024 impairments did not recur.",where_to_verify:"Annual Report 2025 / results release 29 January 2026: CER vs CHF growth; IFRS to core reconciliation."}],top_risks_reference:[{risk:"pricing",why:"The US is about half of pharma sales: IRA price negotiations, most-favoured-nation pricing and tariffs can cut prices on the biggest brands directly."},{risk:"pipeline",why:"Older antibodies face biosimilars and newer brands will lose exclusivity too; value depends on the late-stage pipeline replacing them \u2014 trial failures also trigger impairments."},{risk:"currency",why:"Most sales are in USD, EUR and JPY while Roche reports in CHF: a strong franc reduces reported sales, profit and dividend capacity even when the business grows."}],audit_focus:["Revenue deductions in the US (rebates, chargebacks, returns)","Impairment testing of goodwill and intangible assets (product rights, in-process R&D)","Uncertain tax positions","Legal provisions and contingent liabilities"],quiz:[{level:1,concept:"business_model",prompt:"Which two divisions make up Roche?",options:["Pharmaceuticals and Diagnostics","Pharmaceuticals and Generics","Pharmaceuticals and Consumer Health","Diagnostics and Medical Devices only"],answer:0,explanation:"Roche is the only big pharma company that is also the world leader in in-vitro diagnostics."},{level:3,concept:"one_off_items",prompt:"Roche's IFRS net income dropped to CHF 8.3 bn in 2024 and rebounded in 2025, while core EPS grew in both years. What explains the gap?",options:["Non-cash impairments of goodwill and intangibles in 2024, excluded from core results","A collapse in Pharmaceuticals sales in 2024","A change from IFRS to US GAAP","Higher dividends paid in 2024"],answer:0,explanation:"Impairments hit IFRS profit but not core profit. Ask whether impairments are truly one-off: they show that past acquisitions earned less than expecte
