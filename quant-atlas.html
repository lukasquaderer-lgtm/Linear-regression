<title>Quant Methods Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: sticky syllabus rail on the left, one topic per page on the right; each topic = ideas, formulas, a live lab, exam angle. Graph-paper motif only in the hero. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #131a2c;
  --muted: #586379;
  --line: #d5dbe6;
  --grid: rgba(35, 72, 201, 0.07);
  --accent: #2348c9;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fb;
  --amber: #b9620f;
  --good: #1b7a4f;
  --good-soft: #dff2e8;
  --bad: #b8372a;
  --bad-soft: #f9e2df;
  --warn: #946200;
  --warn-soft: #fbefd2;
  --c1: #2348c9; --c2: #c2560f; --c3: #1b7a4f; --c4: #8a3fb8; --c5: #b8372a; --c6: #0f7f8f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --surface: #151c2d; --surface-2: #1a2236; --ink: #e5e9f2; --muted: #98a3ba; --line: #283250;
    --grid: rgba(122, 162, 255, 0.07); --accent: #7fa3ff; --accent-ink: #0d1220; --accent-soft: #1f2b4d;
    --amber: #f0a65a; --good: #55c48d; --good-soft: #15322a; --bad: #ff8073; --bad-soft: #3a1e1f; --warn: #e8b84a; --warn-soft: #352b14;
    --c1: #7fa3ff; --c2: #f0a65a; --c3: #55c48d; --c4: #c79bf0; --c5: #ff8073; --c6: #4fd0dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2d; --surface-2: #1a2236; --ink: #e5e9f2; --muted: #98a3ba; --line: #283250;
  --grid: rgba(122, 162, 255, 0.07); --accent: #7fa3ff; --accent-ink: #0d1220; --accent-soft: #1f2b4d;
  --amber: #f0a65a; --good: #55c48d; --good-soft: #15322a; --bad: #ff8073; --bad-soft: #3a1e1f; --warn: #e8b84a; --warn-soft: #352b14;
  --c1: #7fa3ff; --c2: #f0a65a; --c3: #55c48d; --c4: #c79bf0; --c5: #ff8073; --c6: #4fd0dc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.2vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1260px; margin: 0 auto; padding-inline: 24px; padding-block: 10px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
.progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.progress .bar { width: 110px; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; font-size: 0.9rem; cursor: pointer; }

/* shell */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; max-width: 1260px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 80px; }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; padding-right: 4px; }
.nav h4 { margin: 18px 0 6px; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav h4:first-child { margin-top: 0; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 0.95rem; line-height: 1.3; }
.nav a:hover { background: var(--surface); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.nav a.done .dot { background: var(--good); border-color: var(--good); }
.nav a.done .dot::after { content: ""; width: 5px; height: 8px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.nav a .tag { margin-left: auto; font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
main { min-width: 0; }

@media (max-width: 880px) {
  .shell { grid-template-columns: 1fr; padding-inline: 16px; gap: 20px; }
  .topbar-in { padding-inline: 16px; }
  .menu-btn { display: inline-block; }
  .brand span, .progress .bar { display: none; }
  .nav { display: none; position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .nav.open { display: block; }
}

/* home */
.hero { position: relative; border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 4vw, 40px); overflow: hidden; background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero .lede { font-size: 1.15rem; color: var(--muted); max-width: 54ch; margin-top: 14px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.hero canvas { width: 100%; display: block; }
@media (max-width: 760px) { .hero-grid { grid-template-columns: 1fr; } }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 11px; font-size: 0.85rem; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 40px 0 14px; }
.map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .map { grid-template-columns: 1fr; } }
.map-col h3 { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.map-col h3 small { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-weight: 400; }
.map-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.map-item:hover b { color: var(--accent); }
.map-item b { display: block; font-weight: 700; }
.map-item span { font-size: 0.9rem; color: var(--muted); line-height: 1.45; display: block; }
.map-item .num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); padding-top: 3px; }
.map-item.done .num { color: var(--good); font-weight: 600; }
.lab-tag { display: inline-block; font-family: var(--font-mono); font-size: 0.66rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .tools { grid-template-columns: 1fr; } }
.tool { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-decoration: none; color: var(--ink); }
.tool:hover { border-color: var(--accent); }
.tool b { font-family: var(--font-display); font-size: 1.05rem; display: block; margin-bottom: 4px; }
.tool span { font-size: 0.9rem; color: var(--muted); line-height: 1.45; display: block; }

/* topic */
.topic { display: grid; gap: 34px; }
.t-head { display: grid; gap: 10px; max-width: 760px; }
.t-head .lede { font-size: 1.2rem; color: var(--muted); }
.prose { max-width: 760px; }
.ideas { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.ideas li { position: relative; padding-left: 22px; }
.ideas li::before { content: ""; position: absolute; left: 4px; top: 0.68em; width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
.ideas b { font-weight: 700; }
.formulas { margin: 12px 0 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.formulas .row { display: grid; grid-template-columns: minmax(130px, 220px) minmax(0, 1fr); gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.formulas .row:last-child { border-bottom: 0; }
.formulas dt { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.formulas dd { margin: 0; font-family: var(--font-math); font-size: 1.15rem; overflow-x: auto; white-space: nowrap; }
.formulas dd small { font-family: var(--font-body); font-size: 0.85rem; color: var(--muted); white-space: normal; display: block; }
@media (max-width: 600px) { .formulas .row { grid-template-columns: 1fr; gap: 2px; } }
.math { font-family: var(--font-math); font-size: 1.08em; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.panel ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; }
.panel.exam h2 { color: var(--accent); }
.panel.traps h2 { color: var(--bad); }
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.data { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
table.data th { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.t-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 20px; }
.t-foot .pn { display: flex; gap: 10px; flex-wrap: wrap; }
.mark.on { background: var(--good); border-color: var(--good); color: var(--surface); }

/* labs */
.lab { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 16px; }
.lab-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.lab-head p { color: var(--muted); font-size: 0.95rem; max-width: 64ch; }
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); gap: 20px; }
@media (max-width: 980px) { .lab-grid { grid-template-columns: 1fr; } }
.plots { display: grid; gap: 12px; min-width: 0; align-content: start; }
canvas.plot { width: 100%; display: block; background: var(--surface-2); border-radius: 10px; touch-action: manipulation; }
.plot-cap { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.plot-cap i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.side { display: grid; gap: 16px; align-content: start; min-width: 0; }
.ctl { display: grid; gap: 4px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; font-weight: 600; }
.ctl output { font-family: var(--font-mono); font-weight: 400; color: var(--accent); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 0.82rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .k { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.02em; }
.stat .v { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.verdicts { display: grid; gap: 8px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.9rem; line-height: 1.4; }
.chip { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.note { font-size: 0.9rem; color: var(--muted); line-height: 1.5; }
.bars { display: grid; gap: 6px; }
.bars .b { display: grid; grid-template-columns: 44px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 0.78rem; }
.bars .track { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); }
.bars .b:nth-child(2) .fill { background: var(--amber); }
.cm { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px; font-family: var(--font-mono); font-size: 0.8rem; }
.cm div { padding: 8px; border-radius: 6px; text-align: center; }
.cm .h { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: .05em; padding: 4px; }
.cm .tp, .cm .tn { background: var(--good-soft); color: var(--good); font-weight: 600; }
.cm .fp, .cm .fn { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.cm .cell small { display: block; font-size: 0.62rem; opacity: .8; font-weight: 400; }

/* chooser */
.chooser { display: grid; gap: 14px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.trail span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; }
.qcard h2 { font-size: 1.3rem; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt b { font-weight: 700; }
.opt span { font-size: 0.88rem; color: var(--muted); }
.leaf { border-color: var(--accent); }
.steps { counter-reset: s; list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-mono); color: var(--accent); font-weight: 600; padding-top: 2px; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: 0.93rem; }

/* quiz */
.quiz-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; }
.score { font-family: var(--font-mono); font-size: 0.9rem; }
select, input[type=search] { font: inherit; font-size: 0.92rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.qlist { display: grid; gap: 14px; margin-top: 16px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 12px; }
.q .stem { font-weight: 600; }
.q .opts .opt { grid-template-columns: 26px minmax(0, 1fr); align-items: baseline; gap: 8px; }
.q .opt .l { font-family: var(--font-mono); color: var(--muted); }
.q .opt.right { border-color: var(--good); background: var(--good-soft); }
.q .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q .opt[disabled] { cursor: default; }
.q .why { font-size: 0.93rem; border-top: 1px dashed var(--line); padding-top: 10px; }
.q .why b { color: var(--good); }
.q .why.miss b { color: var(--bad); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.yes { color: var(--good); font-weight: 600; font-family: var(--font-mono); font-size: 0.8rem; }
.no { color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; }
.fs-group { margin-top: 28px; }
.fs-group h3 a { color: var(--ink); text-decoration: none; }
.fs-group h3 a:hover { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="topbar">
  <div class="topbar-in">
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Contents</button>
    <a class="brand" href="#home"><b>Quant Methods Atlas</b><span>CFA L2 quant · ML</span></a>
    <div class="progress" title="Topics marked as understood"><span id="progTxt">0 / 15</span><div class="bar"><i id="progBar"></i></div></div>
  </div>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Topics"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function colors() {
  return { ink: cssv('--ink'), muted: cssv('--muted'), line: cssv('--line'), grid: cssv('--line'), accent: cssv('--accent'), amber: cssv('--amber'),
    good: cssv('--good'), bad: cssv('--bad'), surface: cssv('--surface'), surface2: cssv('--surface-2'),
    cat: ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'].map(cssv), mono: cssv('--font-mono') || 'monospace' };
}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function gammaln(x) { const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let y = x, tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp); let ser = 1.000000000190015; for (let j = 0; j < 6; j++) ser += c[j] / ++y; return -tmp + Math.log(2.5066282746310005 * ser / x); }
function betacf(a, b, x) { const FP = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < FP) d = FP; d = 1 / d; let h = d; for (let m = 1; m <= 300; m++) { const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2)); d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; h *= d * c; aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2)); d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-14) break; } return h; }
function ibeta(x, a, b) { if (x <= 0) return 0; if (x >= 1) return 1; const bt = Math.exp(gammaln(a + b) - gammaln(a) - gammaln(b) + a * Math.log(x) + b * Math.log(1 - x)); return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b; }

function tCrit(df, alpha = 0.05) { let lo = 0, hi = 60; for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (tP(mid, df) > alpha) lo = mid; else hi = mid; } return (lo + hi) / 2; }
function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }

function ols1(x, y) {
  const n = x.length; let mx = 0, my = 0; for (let i = 0; i < n; i++) { mx += x[i]; my += y[i]; } mx /= n; my /= n;

function acf(a, lags) { const n = a.length; const m = a.reduce((s, v) => s + v, 0) / n; let d = 0; for (const v of a) d += (v - m) ** 2; const out = []; for (let k = 1; k <= lags; k++) { let s = 0; for (let i = k; i < n; i++) s += (a[i] - m) * (a[i - k] - m); out.push(s / d); } return out; }

    ['Log-linear trend', 'ln <i>y<sub>t</sub></i> = <i>b</i><sub>0</sub> + <i>b</i><sub>1</sub><i>t</i> + <i>ε<sub>t</sub></i>  ⇒  <i>ŷ<sub>t</sub></i> = e<sup><i>b</i>0 + <i>b</i>1<i>t</i></sup>'],
    ['DW check', 'DW significantly below 2  ⇒  positive serial correlation  ⇒  model misspecified']
  ],
  exam: [
    'Choose linear vs log-linear from a description or plot of the data.',
    'Compute a forecast from a log-linear model (remember to exponentiate).',
    'Conclude that a significant DW statistic means the trend model is inadequate.'
  ],
  traps: [
    'Forgetting to take e<sup>(…)</sup> of a log-linear forecast.',
    'Financial series almost always fail the DW test in a pure trend model.'
  ] },

{ id: 'ar', g: 'ts', title: 'Autoregressive models', reading: 'CFA L2 · Time-series analysis', lab: 'ar',
  lede: 'Use the series’ own past to forecast its future. Valid only when the series is covariance stationary.',
  ideas: [
    'An <b>AR(p)</b> model regresses x<sub>t</sub> on its own p previous values.',
    '<b>Covariance stationary</b> means three things are constant and finite over time: the mean, the variance, and the covariance with its own leads and lags.',
    'Check the model by testing <b>residual autocorrelations</b>. Each has standard error 1/√T. If none is significant, the model is correctly specified. If some are, add lags.',
    'A stationary AR(1) has a <b>mean-reverting level</b>. Above it, the model forecasts a fall; below it, a rise.',
    'Multi-period forecasts use the <b>chain rule of forecasting</b>: feed each forecast into the next. Uncertainty grows with the horizon.',
    'Compare models <b>out-of-sample</b> with RMSE; the lower RMSE wins. Coefficients can be <b>unstable</b> across sample periods, so prefer a period with a stable regime.'
  ],
  formulas: [
    ['AR(1)', '<i>x<sub>t</sub></i> = <i>b</i><sub>0</sub> + <i>b</i><sub>1</sub><i>x</i><sub><i>t</i>−1</sub> + <i>ε<sub>t</sub></i>'],
    ['Mean-reverting level', 'MRL = <i>b</i><sub>0</sub> / (1 − <i>b</i><sub>1</sub>)<small>Exists only when |b₁| < 1</small>'],
    ['Residual autocorrelation test', '<i>t</i> = <i>ρ̂</i><sub><i>ε</i>,<i>k</i></sub> / (1 / √<i>T</i>),  df = <i>T</i> − 2'],
    ['Two-step forecast', '<i>x̂</i><sub><i>t</i>+2</sub> = <i>b̂</i><sub>0</sub> + <i>b̂</i><sub>1</sub><i>x̂</i><sub><i>t</i>+1</sub>'],
    ['Root mean squared error', 'RMSE = √[ Σ(actual − forecast)² / <i>n</i> ]']
  ],
  exam: [
    'Compute the mean-reverting level and say whether the next forecast rises or falls.',
    'Do a two-step chain-rule forecast.',
    'Given a table of residual autocorrelations and T, decide whether the model is correctly specified.',
    'Pick between two models using out-of-sample RMSE (not in-sample).'
  ],
  traps: [
    'Using the Durbin–Watson test on an AR model. It is invalid there; test residual autocorrelations with t-stats instead.',
    'Assuming a series is stationary because the AR coefficient looks significant.'
  ] },

{ id: 'unitroot', g: 'ts', title: 'Random walks and unit roots', reading: 'CFA L2 · Time-series analysis', lab: 'ar',
  lede: 'When b₁ = 1 the series has no anchor. Test for it with Dickey–Fuller and fix it by first-differencing.',
  ideas: [
    '<b>Random walk:</b> this period’s value equals last period’s plus an unpredictable error. With a <b>drift</b>, a constant b₀ is added each period.',
    'b₁ = 1 is a <b>unit root</b>. The series is not covariance stationary, its variance grows without bound, and the mean-reverting level b₀ / 0 is undefined.',
    'You cannot test b₁ = 1 with an ordinary t-test because the estimate is biased under the null. Use the <b>Dickey–Fuller test</b>: subtract x<sub>t−1</sub> from both sides and test whether g₁ = b₁ − 1 equals zero, using DF critical values (more negative than usual, about −2.9 at 5% with a constant).',
    '<b>Fix:</b> model the first difference y<sub>t</sub> = x<sub>t</sub> − x<sub>t−1</sub>. For a random walk the differenced series is stationary, and it can then be modelled as an AR process.',
    'Exchange rates and asset prices often behave like random walks.'
  ],
  formulas: [
    ['Random walk', '<i>x<sub>t</sub></i> = <i>x</i><sub><i>t</i>−1</sub> + <i>ε<sub>t</sub></i>'],
    ['With drift', '<i>x<sub>t</sub></i> = <i>b</i><sub>0</sub> + <i>x</i><sub><i>t</i>−1</sub> + <i>ε<sub>t</sub></i>'],
    ['Dickey–Fuller', '<i>x<sub>t</sub></i> − <i>x</i><sub><i>t</i>−1</sub> = <i>b</i><sub>0</sub> + <i>g</i><sub>1</sub><i>x</i><sub><i>t</i>−1</sub> + <i>ε<sub>t</sub></i>,  <i>g</i><sub>1</sub> = <i>b</i><sub>1</sub> − 1<small>H₀: g₁ = 0 (unit root). Reject only if t is below the DF critical value.</small>'],
    ['First difference', '<i>y<sub>t</sub></i> = <i>x<sub>t</sub></i> − <i>x</i><sub><i>t</i>−1</sub>']
  ],
  exam: [
    '“Fail to reject H₀ in the Dickey–Fuller test” → unit root → first-difference the data.',
    'Explain why the mean-reverting level is undefined for a random walk.',
    'Identify the null and alternative hypotheses of the DF test.'
  ],
  traps: [
    'In DF, the null is the unit root. Rejecting it is evidence of stationarity.',
    'A random walk with drift still has a unit root.'
  ] },

{ id: 'seasonal', g: 'ts', title: 'Seasonality, ARCH and multiple series', reading: 'CFA L2 · Time-series analysis',
  lede: 'Add a seasonal lag when one season echoes the same season last year, model volatility clustering with ARCH, and check cointegration before regressing one series on another.',
  ideas: [
    '<b>Seasonality</b> shows up as a significant residual autocorrelation at the seasonal lag: lag 4 for quarterly data, lag 12 for monthly. Fix it by adding that lag as a regressor.',
    '<b>ARCH</b> (autoregressive conditional heteroskedasticity): the variance of the error depends on the previous squared error, so calm and volatile periods cluster. Test by regressing squared residuals on lagged squared residuals; a significant a₁ means ARCH is present.',
    'If ARCH is present, the standard errors of the coefficients are wrong. Use generalised least squares or an ARCH-type model, which can also <b>forecast next period’s variance</b>.',
    '<b>Regressing one time series on another</b> is only valid if neither has a unit root, or if both do and they are <b>cointegrated</b> (share a long-run equilibrium). Test with Engle–Granger: run a DF test on the regression residuals using Engle–Granger critical values.'
  ],
  table: { head: ['Unit root in Y?', 'Unit root in X?', 'Cointegrated?', 'Regression valid?'], rows: [
    ['No', 'No', '—', '<span class="yes">Yes</span>'],
    ['Yes', 'No', '—', '<span class="no">No</span>'],
    ['No', 'Yes', '—', '<span class="no">No</span>'],
    ['Yes', 'Yes', 'No', '<span class="no">No (spurious)</span>'],
    ['Yes', 'Yes', 'Yes', '<span class="yes">Yes (long-run relation)</span>']
  ] },
  formulas: [
    ['Seasonal AR', '<i>x<sub>t</sub></i> = <i>b</i><sub>0</sub> + <i>b</i><sub>1</sub><i>x</i><sub><i>t</i>−1</sub> + <i>b</i><sub>2</sub><i>x</i><sub><i>t</i>−4</sub> + <i>ε<sub>t</sub></i>  (quarterly)'],
    ['ARCH(1) test', '<i>ε̂</i>²<sub><i>t</i></sub> = <i>a</i><sub>0</sub> + <i>a</i><sub>1</sub><i>ε̂</i>²<sub><i>t</i>−1</sub> + <i>u<sub>t</sub></i>'],
    ['Variance forecast', '<i>σ̂</i>²<sub><i>t</i>+1</sub> = <i>â</i><sub>0</sub> + <i>â</i><sub>1</sub><i>ε̂</i>²<sub><i>t</i></sub>']
  ],
  exam: [
    'Spot the seasonal lag in a residual autocorrelation table and write the corrected model.',
    'Forecast next-period variance from ARCH(1) estimates.',
    'Use the unit-root / cointegration table to judge whether a regression of two series is valid.'
  ],
  traps: [
    'Adding a seasonal lag to a model is not the same as using seasonal dummies; know which the question uses.',
    'Engle–Granger uses its own critical values, not standard DF values.'
  ] },

/* ===== MACHINE LEARNING ===== */
{ id: 'mlbasics', g: 'ml', title: 'ML foundations and overfitting', reading: 'CFA L2 · Machine learning', lab: 'overfit',
  lede: 'Machine learning trades interpretability for flexibility. The central risk is a model that memorises noise.',
  ideas: [
    '<b>Supervised learning</b> uses labelled data: a target (Y) and features (X). Continuous targets are regression problems; categorical targets are classification problems.',
    '<b>Unsupervised learning</b> has no target. It finds structure: dimension reduction and clustering.',
    '<b>Deep learning</b> and <b>reinforcement learning</b> can be supervised or unsupervised and handle very complex tasks.',
    'Data is split into <b>training</b>, <b>validation</b> (to tune) and <b>test</b> (final out-of-sample check) samples.',
    '<b>Overfitting:</b> the model learns noise. In-sample error is low but out-of-sample error is high. <b>Underfitting:</b> the model is too simple to capture the pattern.',
    'Total out-of-sample error = <b>bias error</b> (underfit, model too simple) + <b>variance error</b> (overfit, model too complex) + <b>base error</b> (irreducible noise).',
    'Control overfitting by limiting complexity (penalties, pruning) and by <b>k-fold cross-validation</b>: split the data into k parts, train on k − 1, validate on the remaining one, rotate, and average.'
  ],
  formulas: [
    ['Error decomposition', 'Out-of-sample error = bias error + variance error + base error'],
    ['k-fold cross-validation', 'CV error = (1/<i>k</i>) Σ<sub><i>j</i></sub> error on fold <i>j</i> when trained on the other <i>k</i> − 1 folds']
  ],
  exam: [
    'Diagnose a model from in-sample vs out-of-sample accuracy (both low = bias; gap = variance).',
    'Name the remedy: reduce complexity / add penalty for overfit; add features or flexibility for underfit.',
    'Explain why the test sample must not be used for tuning.'
  ],
  traps: [
    'Perfect in-sample fit is a warning sign, not a success.',
    'Base error cannot be reduced by any model.'
  ] },

{ id: 'supervised', g: 'ml', title: 'Penalized regression, SVM and KNN', reading: 'CFA L2 · Machine learning',
  lede: 'Three supervised workhorses: regression that punishes complexity, a classifier that maximises the margin, and a classifier that asks the neighbours.',
  ideas: [
    '<b>Penalized regression (LASSO)</b> minimises SSE plus a penalty λ times the sum of absolute coefficients. It shrinks some coefficients to exactly zero, so it performs <b>feature selection</b>. λ is a hyperparameter; λ = 0 gives OLS. Ridge uses squared coefficients and shrinks without zeroing.',
    '<b>Support vector machine (SVM):</b> a linear classifier that finds the boundary with the widest margin between two classes. The points on the margin are the support vectors. A <b>soft margin</b> tolerates some misclassification; kernels handle non-linear boundaries.',
    '<b>K-nearest neighbours (KNN):</b> classify a new point by majority vote of its k closest training points. Non-parametric and intuitive, but sensitive to the distance metric, feature scaling and irrelevant features.',
    'Choosing k: too small fits noise (high variance); too large blurs real distinctions (high bias). An even k can produce ties in binary problems.',
    'Finance uses: LASSO for selecting factors from many candidates; SVM for credit default or bankruptcy classification; KNN for bond rating prediction and finding comparable companies.'
  ],
  formulas: [
    ['LASSO objective', 'min Σ(<i>Y<sub>i</sub></i> − <i>Ŷ<sub>i</sub></i>)² + <i>λ</i> Σ|<i>b<sub>k</sub></i>|'],
    ['Ridge objective', 'min Σ(<i>Y<sub>i</sub></i> − <i>Ŷ<sub>i</sub></i>)² + <i>λ</i> Σ<i>b<sub>k</sub></i>²'],
    ['Euclidean distance', '<i>d</i> = √Σ(<i>x<sub>j</sub></i> − <i>x′<sub>j</sub></i>)²']
  ],
  exam: [
    'Explain how LASSO reduces overfitting and why it can drop variables.',
    'Identify which algorithm fits a vignette: “classify with a maximum-margin boundary” → SVM.',
    'Explain the effect of increasing k in KNN.'
  ],
  traps: [
    'λ is chosen by the analyst (via cross-validation), not estimated by the model.',
    'KNN needs standardised features; otherwise the feature with the largest scale dominates.'
  ] },

{ id: 'trees', g: 'ml', title: 'Decision trees and ensembles', reading: 'CFA L2 · Machine learning',
  lede: 'A tree splits the data with yes/no questions. Many trees together, built cleverly, beat any single one.',
  ideas: [
    '<b>CART</b> (classification and regression trees) splits on one feature at a time at each node, choosing the split that most reduces impurity (Gini or entropy for classification, SSE for regression). Terminal nodes hold the prediction.',
    'Trees are <b>interpretable</b> and handle non-linear relationships and interactions, but a deep tree overfits. Control it with maximum depth, minimum observations per leaf, or <b>pruning</b>.',
    '<b>Ensemble learning</b> combines many models. Averaging reduces variance and usually improves out-of-sample accuracy.',
    '<b>Voting classifier:</b> different algorithms vote. <b>Bagging</b> (bootstrap aggregating): train the same algorithm on many bootstrap samples, then average or vote.',
    '<b>Random forest:</b> bagged trees that also consider only a random subset of features at each split, which de-correlates the trees and sharply reduces overfitting. Cost: less interpretable.',
    '<b>Boosting:</b> train models sequentially, each one focusing on the errors of the previous ones (AdaBoost re-weights misclassified points; gradient boosting fits the residuals).'
  ],
  formulas: [
    ['Gini impurity', 'Gini = 1 − Σ <i>p<sub>i</sub></i>²'],
    ['Entropy', 'H = −Σ <i>p<sub>i</sub></i> log₂ <i>p<sub>i</sub></i>'],
    ['Bagged prediction', '<i>ŷ</i> = (1/<i>B</i>) Σ<sub><i>b</i></sub> <i>ŷ</i><sub>(<i>b</i>)</sub>  (regression) or majority vote (classification)']
  ],
  exam: [
    'Explain how random forests reduce overfitting relative to a single tree.',
    'Distinguish bagging (parallel, bootstrap samples) from boosting (sequential, focus on errors).',
    'Recognise that CART output is easy to visualise and explain to clients.'
  ],
  traps: [
    'A random forest is not more interpretable than a tree.',
    'Bagging samples rows with replacement; the random feature subset is the extra step in a random forest.'
  ] },

{ id: 'pca', g: 'ml', title: 'Principal components analysis', reading: 'CFA L2 · Machine learning', lab: 'pca',
  lede: 'Replace many correlated features with a few uncorrelated composites that keep most of the information.',
  ideas: [
    '<b>Unsupervised dimension reduction.</b> PCA rotates the axes so the first new axis (PC1) points along the direction of greatest variance, PC2 along the greatest remaining variance at right angles, and so on.',
    '<b>Eigenvectors</b> are the directions (the new axes, as weights on the original features). <b>Eigenvalues</b> are the variance explained along each one.',
    'The principal components are <b>uncorrelated</b> with each other, which removes multicollinearity among features.',
    'Choose how many to keep with a <b>scree plot</b> of variance explained; typically keep enough to explain 85–95% of total variance.',
    '<b>Standardise first</b> when features are in different units, otherwise the largest-scale feature dominates.',
    'Downside: components are blends of the original features and are hard to interpret. Classic finance example: three components of yield-curve changes, often read as level, slope and curvature, explain most of the variation.'
  ],
  formulas: [
    ['Share of variance', 'Proportion explained by PC<sub><i>j</i></sub> = <i>λ<sub>j</sub></i> / Σ<i>λ</i>'],
    ['Component score', 'PC<sub>1</sub> = <i>w</i><sub>11</sub><i>x</i><sub>1</sub> + <i>w</i><sub>12</sub><i>x</i><sub>2</sub> + … ,  with ‖<i>w</i>‖ = 1']
  ],
  exam: [
    'Compute the proportion of variance explained from eigenvalues.',
    'Decide how many components to keep from a scree plot or a cumulative-variance table.',
    'State that PCA is unsupervised and that components are uncorrelated.'
  ],
  traps: [
    'PCA does not use the target variable.',
    'More components always explain more variance; the question is how few you need.'
  ] },

{ id: 'clustering', g: 'ml', title: 'Clustering', reading: 'CFA L2 · Machine learning', lab: 'kmeans',
  lede: 'Group observations so members of a cluster are alike and clusters differ from each other, without any labels.',
  ideas: [
    '<b>K-means:</b> choose k, place k centroids, assign each point to its nearest centroid, move each centroid to the mean of its points, and repeat until assignments stop changing.',
    'K-means is fast and scales to large data, but you must choose k in advance and results depend on the starting centroids. The <b>elbow method</b> plots within-cluster sum of squares against k and looks for the bend.',
    '<b>Hierarchical clustering</b> builds a hierarchy without fixing k. <b>Agglomerative</b> (bottom-up) starts with each point as its own cluster and merges the closest pair repeatedly. <b>Divisive</b> (top-down) starts with one cluster and splits.',
    'A <b>dendrogram</b> shows the merge history; cutting it at a given height gives a set of clusters.',
    'Finance uses: data-driven peer groups and sector classifications, and checking whether a “diversified” portfolio is really spread across distinct clusters.'
  ],
  formulas: [
    ['Within-cluster sum of squares', 'WCSS = Σ<sub>clusters</sub> Σ<sub><i>i</i>∈<i>c</i></sub> ‖<i>x<sub>i</sub></i> − <i>μ<sub>c</sub></i>‖²'],
    ['Centroid update', '<i>μ<sub>c</sub></i> = (1/|<i>c</i>|) Σ<sub><i>i</i>∈<i>c</i></sub> <i>x<sub>i</sub></i>']
  ],
  exam: [
    'Describe the k-means steps in order.',
    'Contrast k-means (preset k) with hierarchical clustering (no preset k, dendrogram).',
    'Agglomerative vs divisive: which direction each one works.'
  ],
  traps: [
    'WCSS always falls as k rises; the minimum is not the answer.',
    'Clustering finds groups; it does not tell you what they mean.'
  ] },

{ id: 'neural', g: 'ml', title: 'Neural networks, deep and reinforcement learning', reading: 'CFA L2 · Machine learning',
  lede: 'Layers of simple nodes that, stacked deep enough, can approximate almost any non-linear relationship.',
  ideas: [
    'A neural network has an <b>input layer</b> (one node per feature), one or more <b>hidden layers</b>, and an <b>output layer</b>.',
    'Each node applies a <b>summation operator</b> (weighted sum of inputs plus a bias) and then an <b>activation function</b> (sigmoid, tanh, ReLU) that adds non-linearity.',
    '<b>Learning:</b> forward propagation produces a prediction, the error is measured, and <b>backpropagation</b> adjusts the weights by gradient descent. The <b>learning rate</b> sets the size of each step.',
    '<b>Hyperparameters</b> set by the analyst: number of hidden layers, nodes per layer, activation function, learning rate, number of training epochs.',
    '<b>Deep learning nets</b> have many hidden layers (often 20+) and power image recognition, speech and natural language processing.',
    '<b>Reinforcement learning:</b> an agent takes actions in an environment and learns by trial and error to maximise cumulative reward, with no labelled data. Examples: game-playing systems, trade execution.'
  ],
  formulas: [
    ['Node output', '<i>a</i> = <i>f</i>( Σ <i>w<sub>i</sub>x<sub>i</sub></i> + <i>b</i> )'],
    ['Activations', 'ReLU(<i>z</i>) = max(0, <i>z</i>);  sigmoid(<i>z</i>) = 1 / (1 + e<sup>−<i>z</i></sup>)'],
    ['Gradient descent', '<i>w</i> ← <i>w</i> − <i>η</i> · ∂Loss / ∂<i>w</i>']
  ],
  exam: [
    'Identify the summation operator and activation function in a node.',
    'Explain what the learning rate does and the trade-off of setting it too high or too low.',
    'Match a task to RL (agent, reward) vs deep learning (complex pattern recognition).'
  ],
  traps: [
    'Without a non-linear activation, a stack of layers is just a linear model.',
    'Neural nets need large data sets and are prone to overfitting; they are hard to interpret.'
  ] },

{ id: 'bigdata', g: 'ml', title: 'Big data projects and model evaluation', reading: 'CFA L2 · Big data projects', lab: 'roc',
  lede: 'Most of the work is preparing data. Then you judge the model with a confusion matrix, not a single accuracy number.',
  ideas: [
    '<b>Big data characteristics:</b> volume, variety, velocity, and veracity (credibility of the data).',
    '<b>Structured data project steps:</b> conceptualisation, data collection, data preparation and wrangling, data exploration, model training. Text projects follow the same arc: text problem formulation, data curation, text preparation and wrangling, text exploration, model training.',
    '<b>Data cleansing</b> fixes incompleteness, invalidity, inaccuracy, inconsistency, non-uniformity and duplication. <b>Wrangling</b> covers extraction, aggregation, filtration, selection and conversion; outliers can be trimmed or winsorised.',
    '<b>Scaling:</b> normalisation squeezes values into [0, 1] and is sensitive to outliers; standardisation converts to z-scores and suits roughly normal data.',
    '<b>Text preparation:</b> tokenisation, lowercasing, removing stop words and punctuation, stemming (crude suffix removal) or lemmatisation (dictionary base form), then a bag-of-words or n-gram representation in a document term matrix.',
    '<b>Feature selection</b> keeps informative features (frequency, chi-square, mutual information); <b>feature engineering</b> creates new ones (n-grams, named entity recognition).',
    '<b>Evaluation:</b> confusion matrix, precision, recall, accuracy, F1 score, the ROC curve with its AUC, and RMSE for continuous targets. Tune hyperparameters with grid search.'
  ],
  formulas: [
    ['Precision', 'P = TP / (TP + FP)<small>Of everything flagged positive, how much was right. Matters when false positives are costly.</small>'],
    ['Recall (sensitivity)', 'R = TP / (TP + FN)<small>Of all true positives, how many we caught. Matters when false negatives are costly.</small>'],
    ['Accuracy', '(TP + TN) / (TP + FP + TN + FN)'],
    ['F1 score', 'F1 = 2 · P · R / (P + R)<small>Better than accuracy when classes are unequal.</small>'],
    ['False positive rate', 'FPR = FP / (FP + TN)<small>ROC plots recall (TPR) against FPR.</small>'],
    ['Normalisation', '(<i>X<sub>i</sub></i> − <i>X</i><sub>min</sub>) / (<i>X</i><sub>max</sub> − <i>X</i><sub>min</sub>)'],
    ['Standardisation', '(<i>X<sub>i</sub></i> − <i>μ</i>) / <i>σ</i>'],
    ['TF–IDF', 'TF × ln(total documents / documents containing the term)']
  ],
  exam: [
    'Compute precision, recall, accuracy and F1 from a confusion matrix.',
    'Pick the metric that matters: catching every default (recall) vs avoiding false alarms (precision).',
    'Order the steps of a big data project and classify a data error (e.g. a negative age is invalidity).',
    'Stemming vs lemmatisation; normalisation vs standardisation.'
  ],
  traps: [
    'High accuracy on imbalanced data can hide a useless model.',
    'An AUC of 0.5 is a coin flip, not “half good”.'
  ] }
];
